<svg xmlns="http://www.w3.org/2000/svg" width="540" height="350" viewBox="0 0 540 350" role="img" aria-labelledby="title desc"><title id="title">works on my machine™</title><desc id="desc">原创学习梗图。在我的电脑上：一切正常。。在另一台电脑上：环境：我们认识吗。</desc><rect width="540" height="350" rx="8" fill="#232723"/><rect x="10" y="52" width="250" height="251" rx="4" fill="#2f352c"/><rect x="280" y="52" width="250" height="251" rx="4" fill="#2c302b"/><text x="270" y="32" text-anchor="middle" fill="#b3c0a7" font-size="19" font-family="'Microsoft YaHei','PingFang SC',sans-serif">works on my machine™</text><text x="135" y="81" text-anchor="middle" fill="#e4e4d5" font-size="18" font-family="'Microsoft YaHei','PingFang SC',sans-serif">在我的电脑上</text><text x="405" y="81" text-anchor="middle" fill="#e4e4d5" font-size="18" font-family="'Microsoft YaHei','PingFang SC',sans-serif">在另一台电脑上</text><g><rect x="24" y="96" width="202" height="120" rx="7" fill="#202520" stroke="#58634e"/><circle cx="37" cy="109" r="3" fill="#b8a48b"/><circle cx="49" cy="109" r="3" fill="#b3bb88"/><circle cx="61" cy="109" r="3" fill="#88a68f"/><text x="125" y="144" text-anchor="middle" fill="#b5d0b4" font-size="15" font-family="'Microsoft YaHei','PingFang SC',sans-serif">$ python app.py</text><text x="125" y="170" text-anchor="middle" fill="#d4c3a9" font-size="15" font-family="'Microsoft YaHei','PingFang SC',sans-serif">Hello, world!</text></g><g><rect x="294" y="96" width="202" height="120" rx="7" fill="#202520" stroke="#58634e"/><circle cx="307" cy="109" r="3" fill="#b8a48b"/><circle cx="319" cy="109" r="3" fill="#b3bb88"/><circle cx="331" cy="109" r="3" fill="#88a68f"/><text x="395" y="144" text-anchor="middle" fill="#b5d0b4" font-size="15" font-family="'Microsoft YaHei','PingFang SC',sans-serif">$ python app.py</text><text x="395" y="170" text-anchor="middle" fill="#d4c3a9" font-size="15" font-family="'Microsoft YaHei','PingFang SC',sans-serif">ModuleNotFoundError</text></g><text x="135" y="280" text-anchor="middle" fill="#e4e4d