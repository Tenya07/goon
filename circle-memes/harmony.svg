<svg xmlns="http://www.w3.org/2000/svg" width="540" height="350" viewBox="0 0 540 350" role="img" aria-labelledby="title desc"><title id="title">只想配个和弦的我</title><desc id="desc">原创学习梗图。旋律只给了一个 G：所以，到底配哪个？。C 大调的和弦们：T 和 D：我们都有。</desc><rect width="540" height="350" rx="8" fill="#232723"/><rect x="10" y="52" width="250" height="251" rx="4" fill="#2f352c"/><rect x="280" y="52" width="250" height="251" rx="4" fill="#2c302b"/><text x="270" y="32" text-anchor="middle" fill="#b3c0a7" font-size="19" font-family="'Microsoft YaHei','PingFang SC',sans-serif">只想配个和弦的我</text><text x="135" y="81" text-anchor="middle" fill="#e4e4d5" font-size="18" font-family="'Microsoft YaHei','PingFang SC',sans-serif">旋律只给了一个 G</text><text x="405" y="81" text-anchor="middle" fill="#e4e4d5" font-size="18" font-family="'Microsoft YaHei','PingFang SC',sans-serif">C 大调的和弦们</text><g transform="translate(125 158)" fill="none" stroke="#cbd4bc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M-49-20-43-59-18-38q18-8 36 0l25-21 6 39q16 60-49 65-65-5-49-65Z" fill="#394335"/><circle cx="-19" cy="-8" r="4" fill="#cbd4bc"/><circle cx="19" cy="-8" r="4" fill="#cbd4bc"/><ellipse cx="0" cy="24" rx="6" ry="9"/><path d="M-40 67q40-35 80 0m-32-20v29m-16-29v29"/></g><g><rect x="294" y="96" width="202" height="120" rx="7" fill="#202520" stroke="#58634e"/><circle cx="307" cy="109" r="3" fill="#b8a48b"/><circle cx="319" cy="109" r="3" fill="#b3bb88"/><circle cx="331" cy="109" r="3" fill="#88a68f"/><text x="395" y="144" text-anchor="middle" fill="#b5d0b4" font-size="15" font-family="'Microsoft YaHei','PingFang SC',sans-serif">T = C E G</text><text x="395" y="170" text-anchor="middle" fill="#d4c3a9" font-size="15" font-family="'Microsoft YaHei','PingFang SC',sans-serif">D = G B D</text></g><text x="135" y="280" text-anchor="middle" fill="#e4e4d5" font-size="17" font-family="'Microsoft YaHei','PingFang SC',sans-serif">所以，到底配哪个？</text><text x="405" y="280" text-anchor="middle" fill="#e4e4d5" font-size="17" font-family="'Microsoft YaHei','PingFang SC',sans-serif">T 和 D：我们都有</text><text x="270" y="329" text-anchor="middle" fill="#879480" font-size="11" font-family="'Microsoft YaHei','PingFang SC',sans-serif">学习区冲浪 · 原创梗图 / 情景示意</text></svg>