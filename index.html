<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b12"><style>[hidden]{display:none!important}</style>
<title>五年学习本</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{
  /* 纯阳 · 鹤 —— 80 蓝 / 10 红 / 5 黑 / 5 白（全站同一套，背景永远是黑） */
  --paper:#080b12; --paper-2:#0e1730; --ink:#f2f6fc; --ink-2:#9db0d4; --ink-3:#6c80a8;
  --line:#24365f; --accent:#4a86f7; --accent-2:#7ba7fa; --accent-soft:#16264b;
  --gold:#6fe0cd; --ok:#6fe0cd; --ok-soft:#10312e; --warn:#e5473b; --warn-soft:#3a1512;
  --card:#111c3a; --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.45);
  --red:#e5473b; --red-soft:#3a1512; --green:#6fe0cd; --green-soft:#10312e;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
  /* 纯阳 · 鹤 —— 80 蓝 / 10 红 / 5 黑 / 5 白（全站同一套，背景永远是黑） */
  --paper:#080b12; --paper-2:#0e1730; --ink:#f2f6fc; --ink-2:#9db0d4; --ink-3:#6c80a8;
  --line:#24365f; --accent:#4a86f7; --accent-2:#7ba7fa; --accent-soft:#16264b;
  --gold:#6fe0cd; --ok:#6fe0cd; --ok-soft:#10312e; --warn:#e5473b; --warn-soft:#3a1512;
  --card:#111c3a; --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.45);
  --red:#e5473b; --red-soft:#3a1512; --green:#6fe0cd; --green-soft:#10312e;
  }
}
:root[data-theme="dark"]{
  /* 纯阳 · 鹤 —— 80 蓝 / 10 红 / 5 黑 / 5 白（全站同一套，背景永远是黑） */
  --paper:#080b12; --paper-2:#0e1730; --ink:#f2f6fc; --ink-2:#9db0d4; --ink-3:#6c80a8;
  --line:#24365f; --accent:#4a86f7; --accent-2:#7ba7fa; --accent-soft:#16264b;
  --gold:#6fe0cd; --ok:#6fe0cd; --ok-soft:#10312e; --warn:#e5473b; --warn-soft:#3a1512;
  --card:#111c3a; --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.45);
  --red:#e5473b; --red-soft:#3a1512; --green:#6fe0cd; --green-soft:#10312e;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:15px;line-height:1.65}
h1,h2,h3{font-family:"Noto Serif SC","Songti SC","SimSun",serif;text-wrap:balance;margin:0}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--accent-2);outline-offset:1px}
textarea{resize:vertical;min-height:72px}

.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{border-right:1px solid var(--line);background:var(--paper-2);padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:0 8px 18px;border-bottom:1px solid var(--line);margin-bottom:12px}
.brand h1{font-size:22px;letter-spacing:.04em}
.brand p{margin:4px 0 0;font-size:12px;color:var(--ink-3);letter-spacing:.12em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;color:var(--ink-2)}
.nav button:hover{background:var(--card)}
.nav button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow);font-weight:500}
.nav .k{font-family:"Noto Serif SC",serif;font-size:13px;color:var(--accent);width:16px;text-align:center}
.nav .cnt{margin-left:auto;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.main{padding:32px 40px 80px;max-width:1040px;width:100%}
.sync{font-size:12px;color:var(--ink-3);margin-top:16px;padding:0 8px}

.head{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:22px}
.head .eyebrow{font-size:12px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase;margin-bottom:6px}
.head h2{font-size:30px;line-height:1.2}
.head .lead{color:var(--ink-2);margin:8px 0 0;max-width:62ch}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.sec{margin-bottom:28px}
.sec h3{font-size:17px;display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.sec h3 small{font-family:"Noto Sans SC",sans-serif;font-weight:400;font-size:12px;color:var(--ink-3)}
.plan{background:var(--card);border-left:3px solid var(--gold);padding:12px 16px;border-radius:0 8px 8px 0;color:var(--ink-2);font-size:14px}
.plan b{color:var(--ink);font-weight:500}
.plan p{margin:0 0 6px}.plan p:last-child{margin:0}

.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start}
.item .t{font-weight:500}
.item .t a{text-decoration:none;border-bottom:1px solid var(--accent-soft)}
.item .n{color:var(--ink-2);font-size:13.5px;white-space:pre-wrap}
.item .m{color:var(--ink-3);font-size:12px;margin-top:2px}
.pill{border:0;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:500;white-space:nowrap}
.pill.want{background:var(--paper-2);color:var(--ink-2)}
.pill.doing{background:var(--warn-soft);color:var(--warn)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.x{background:none;border:0;color:var(--ink-3);padding:2px 6px;border-radius:4px;font-size:16px;line-height:1}
.x:hover{color:var(--accent);background:var(--accent-soft)}
.x.arm{color:#fff;background:var(--accent);font-size:12px;padding:3px 8px;white-space:nowrap}
.empty{color:var(--ink-3);font-size:13.5px;padding:10px 0;border-top:1px dashed var(--line)}

.form{display:grid;gap:8px;background:var(--paper-2);border-radius:8px;padding:12px;margin-top:10px}
.form .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:8px 14px;font-weight:500}
.btn:hover{background:var(--accent-2)}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--line)}
.actions{display:flex;justify-content:flex-end;gap:8px}

.note{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;position:relative}
.note .d{font-size:11px;color:var(--ink-3);letter-spacing:.06em;margin-bottom:4px}
.note .b{white-space:pre-wrap}
.note .x{position:absolute;top:6px;right:6px}

.ops{display:flex;flex-direction:column;gap:18px}
.period h4{font-family:"Noto Serif SC",serif;margin:0 0 8px;font-size:15px;color:var(--accent);display:flex;gap:8px;align-items:baseline}
.period h4 small{font-family:"Noto Sans SC",sans-serif;color:var(--ink-3);font-weight:400;font-size:12px}
.op{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:6px}
.op .top{display:flex;align-items:center;gap:10px;cursor:pointer}
.op .top input[type=checkbox]{width:16px;height:16px;margin:0;accent-color:var(--accent)}
.op .top .nm{flex:1;font-weight:500}
.op .top .nm span{color:var(--ink-3);font-weight:400;font-size:13px;margin-left:6px}
.op.done .top .nm{color:var(--ink-3);text-decoration:line-through}
.op .top .car{color:var(--ink-3);font-size:12px}
.op .body{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.op.open .body{display:block}
.op .body label{font-size:12px;color:var(--ink-3);display:block;margin:6px 0 2px}
.op .body textarea{min-height:52px}
.op .saved{font-size:12px;color:var(--ok);margin-left:10px}
.op .body .desc{margin:0 0 8px;color:var(--ink-2);font-size:13.5px}
.op .body .src{margin:0 0 6px;font-size:13px;color:var(--ink-3)}
.op .body .pass{margin:10px 0 12px;border-top:1px dashed var(--line);padding-top:10px}
.op .body .passhd{font-size:11px;letter-spacing:.12em;color:var(--accent);margin-bottom:8px}
.op .body .pass .p{padding:8px 0 8px 12px;border-left:2px solid var(--gold);margin-bottom:8px}
.op .body .pass .p:last-child{margin-bottom:0}
.op .body .pass .y{font-family:"Noto Serif SC","Songti SC",serif;font-size:15px;line-height:1.85;color:var(--ink);margin:0 0 4px}
.op .body .pass .b{font-size:13.5px;line-height:1.7;color:var(--ink-2);margin:0}
.op .body .pass .s{font-size:11.5px;color:var(--ink-3);margin:4px 0 0}

.opru{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin:5px 0 0;padding-left:26px;font-size:12.5px}
.opru .ru{color:var(--ink-2)}
.opru .or{color:var(--ink-3);font-style:italic}
.osrch{font-size:11.5px;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:1px 9px;text-decoration:none;white-space:nowrap}
.osrch:hover{background:var(--ok-soft)}
@media (max-width:760px){.opru{padding-left:0}}
.opres{margin:0 0 12px;padding:9px 11px;background:var(--paper-2);border-radius:7px}
.opres>b{display:block;font-size:11px;letter-spacing:.12em;color:var(--accent);margin-bottom:7px;font-weight:500}
.opres .list{gap:6px}
.opres .item{padding:7px 10px}
.opnone{margin:0;font-size:12.5px;color:var(--ink-3);line-height:1.6}
.op.hasres{border-left:3px solid var(--gold)}
.sylbtn{margin-top:6px;background:none;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:3px 10px;font-size:11.5px}
.sylbtn:hover{background:var(--warn-soft)}
.hassyl{display:flex;flex-direction:column;gap:0}
.syl{border:1px solid var(--gold);border-top:0;border-radius:0 0 8px 8px;background:var(--paper-2);padding:12px 14px;margin:-4px 0 4px}
.sylhd{margin-bottom:10px}
.sylhd .sn{display:block;font-family:"Noto Serif SC",serif;font-weight:700;font-size:15px;color:var(--ink)}
.sylhd .ss{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.sylhow{background:var(--card);border-left:3px solid var(--gold);border-radius:0 6px 6px 0;padding:10px 12px;margin-bottom:12px;font-size:13px;line-height:1.7;color:var(--ink-2)}
.sylhow .hh{font-size:11px;letter-spacing:.12em;color:var(--accent);margin-bottom:6px}
.sylhow p{margin:0 0 7px}.sylhow p:last-child{margin:0}
.sylhow b{color:var(--ink);font-weight:500}
.sylhow .term{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--paper-2);padding:1px 5px;border-radius:4px;color:var(--ink)}
.wks{display:flex;flex-direction:column;gap:5px}
.wk{background:var(--card);border:1px solid var(--line);border-radius:7px}
.wk.open{border-color:var(--gold)}
.wkt{display:flex;align-items:center;gap:9px;padding:8px 11px}
.wkt input[type=checkbox]{width:15px;height:15px;margin:0;accent-color:var(--accent);flex:none}
.wl{flex:1;font-size:13.5px;font-weight:500;cursor:pointer}
.wl span{display:block;font-weight:400;font-size:11px;color:var(--ink-3);margin-top:1px}
.wk.ok .wl{color:var(--ink-3);text-decoration:line-through}
.wk.ok .wl span{text-decoration:none}
.wkx{background:none;border:0;color:var(--ink-3);font-size:11.5px;padding:3px 6px;border-radius:4px;flex:none}
.wkx:hover{color:var(--accent);background:var(--accent-soft)}
.wkb{padding:0 11px 11px;margin-top:2px;border-top:1px dashed var(--line);padding-top:9px}
.wkb .f{margin-bottom:9px}.wkb .f:last-child{margin-bottom:0}
.wkb .f b{display:block;font-size:11px;letter-spacing:.1em;color:var(--accent);margin-bottom:3px;font-weight:500}
.wkb .f p{margin:0;font-size:13px;line-height:1.7;color:var(--ink-2)}
.wkb .f ul{margin:0;padding-left:18px;font-size:13px;line-height:1.75;color:var(--ink-2)}
.wkb .f.pass p{color:var(--ok)}
.wkb .f.pass b{color:var(--ok)}
.csplan .cspgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
@media(max-width:720px){.csplan .cspgrid{grid-template-columns:1fr}}
.cspd{border:1px solid var(--line,rgba(127,127,127,.25));border-radius:8px;padding:8px;min-height:70px}
.cspd.today{border-color:var(--gold)}
.cspdn{font-size:12px;color:var(--ink-3);margin-bottom:6px}
.cspb{border-left:3px solid var(--gold);padding:2px 0 2px 7px;margin-bottom:8px}
.cspb.trk-side{border-left-color:var(--ok);border-left-style:dashed}
.cspt{font-size:11.5px;color:var(--ink-3)}
.cspn{font-size:13px;font-weight:600}
.cspw{font-size:11.5px;color:var(--ink-3);line-height:1.35}
.cspe{font-size:12px;color:var(--ink-3)}
.cslive{font-size:11.5px;color:var(--gold);margin-top:4px;line-height:1.35}
.cspedit .csprow{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.cspedit .csprow input{width:130px}
.cspedit .csprow select{width:auto}
.wkb .f.fast{border-left:2px solid var(--gold);padding-left:10px}
.wkb .f.fast b{color:var(--gold)}
.wkfast{flex:none;font-size:10.5px;color:var(--ink-3);white-space:nowrap;margin-left:4px}

.wkb .f.mine{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line)}
.wkb .f.mine b{color:var(--gold)}
.wkb .f.mine textarea{min-height:46px;font-size:13px}
.wknbar{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:6px}
.wknbar .btn{padding:4px 12px;font-size:12px}
.wkhas.seen{color:var(--accent);border-color:var(--accent)}
.wkst{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin:0 0 11px;padding:8px 11px;
  background:var(--paper-2);border-radius:7px}
.wkst label{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);cursor:pointer;margin:0}
.wkst label.on{color:var(--ok)}
.wkst input{width:16px;height:16px;margin:0;accent-color:var(--ok);flex:none}
.wkst .hint{font-size:11.5px;color:var(--ink-3);margin-left:auto}
.wkhas{flex:none;font-size:10.5px;letter-spacing:.06em;color:var(--gold);border:1px solid var(--gold);
  border-radius:999px;padding:1px 7px;opacity:.85}
.csweek{background:var(--card);border:1px solid var(--gold);border-radius:10px;padding:12px 16px;margin-bottom:22px}
.csweek .cshd{font-size:11px;letter-spacing:.14em;color:var(--gold);margin-bottom:8px}
.csw{display:flex;align-items:baseline;gap:10px;padding:5px 0;flex-wrap:wrap;font-size:13.5px;line-height:1.55}
.csw+.csw{border-top:1px dashed var(--line)}
.csw>b{flex:none;width:86px;font-weight:500;font-size:12px;color:var(--ink-3);letter-spacing:.04em}
.csw .v{flex:1;min-width:140px;color:var(--ink)}
.csw .v em{font-style:normal;color:var(--ink-3)}
.csw .btn{padding:3px 10px;font-size:12px}
.csw .mini{background:none;border:1px solid var(--line);color:var(--ink-2);border-radius:999px;padding:2px 9px;font-size:11.5px}
.csw .mini:hover{border-color:var(--accent);color:var(--accent)}
.csw select{width:auto;padding:3px 6px;font-size:12px}
.csbar{flex:1 1 120px;height:6px;border-radius:99px;background:var(--paper-2);overflow:hidden;min-width:90px}
.csbar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.csw .done{color:var(--ok)}
.yr{margin:18px 0 2px}
.yr:first-child{margin-top:0}
.yrh{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:4px}
.yrh .yn{font-family:"Noto Serif SC",serif;font-weight:700;font-size:16px;color:var(--ink)}
.yrh .ycnt{margin-left:auto;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.yr .yt{font-size:12px;color:var(--ink-3);margin-top:4px;line-height:1.5}

.grps{display:flex;flex-direction:column;gap:14px}
.grp{border-left:2px solid var(--line);padding-left:12px}
.grp.thin{opacity:.6}
.grph{display:flex;align-items:baseline;gap:8px}
.grph .gn{font-family:"Noto Serif SC",serif;font-weight:700;font-size:14px;color:var(--ink)}
.grph .gc{font-size:11px;color:var(--accent);font-family:ui-monospace,Menlo,Consolas,monospace}
.grph .gcnt{margin-left:auto;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.grp .gd{font-size:12px;color:var(--ink-3);margin:2px 0 0;line-height:1.5}
.grp .list{margin-top:8px}
.grp:not(.thin){border-left-color:var(--gold)}

.reader{margin:10px 0 14px;border:1px solid var(--line);border-radius:8px;background:var(--paper-2);overflow:hidden}
.rhd{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--card)}
.rt{font-family:"Noto Serif SC","Songti SC",serif;font-weight:700;font-size:15px;color:var(--accent)}
.rt small{font-family:"Noto Sans SC",sans-serif;font-weight:400;font-size:12px;color:var(--ink-3);margin-left:8px}
.rnav{margin-left:auto;display:flex;align-items:center;gap:4px;flex:none}
.rbtn{background:none;border:1px solid var(--line);border-radius:6px;color:var(--accent);width:30px;height:28px;font-size:16px;line-height:1;padding:0}
.rbtn:hover:not(:disabled){background:var(--accent-soft)}
.rbtn:disabled{color:var(--ink-3);opacity:.45;cursor:default}
.rpos{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;min-width:48px;text-align:center}
.rbody{padding:14px 16px;background:var(--card)}
.ry{font-family:"Noto Serif SC","Songti SC",serif;font-size:16px;line-height:2.05;color:var(--ink);margin:0;white-space:pre-wrap}
.rb{font-size:13.5px;line-height:1.85;color:var(--ink-2);margin:12px 0 0;padding-top:12px;border-top:1px dashed var(--line);white-space:pre-wrap}
.rn{font-size:12px;line-height:1.7;color:var(--ink-3);margin:10px 0 0;padding-left:10px;border-left:2px solid var(--gold)}
.rft{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.rsel{width:auto;max-width:100%;flex:0 1 260px;font-size:12.5px;padding:5px 8px}
.rsub{font-size:11.5px;color:var(--ink-3);flex:1 1 180px}
@media (max-width:760px){.ry{font-size:15px;line-height:1.95}.rhd{flex-wrap:wrap}.rnav{margin-left:0;width:100%;justify-content:flex-end}}

.ask .askbox{background:var(--paper-2);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ask textarea{min-height:64px}
.askbar{display:flex;align-items:center;gap:8px}
.askbar .btn{margin-left:auto}
.askbar .btn+.btn{margin-left:0}
.asknote{font-size:12px;color:var(--ink-3)}
.asknote.bad{color:var(--accent)}
.askout{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;white-space:pre-wrap;font-size:14px;line-height:1.7}
.op .top .car{max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}

.vocab{width:100%;border-collapse:collapse;font-size:14px}
.vocab th{text-align:left;font-size:12px;color:var(--ink-3);font-weight:500;letter-spacing:.08em;border-bottom:1px solid var(--line);padding:6px 8px}
.vocab td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.vocab td.ru{font-weight:500}
.vocab td.ex{color:var(--ink-2);font-size:13px}
.vocab tr.mine td{background:var(--accent-soft)}
.tablewrap{overflow-x:auto}

.lesson{display:flex;flex-direction:column;gap:8px}
.lesson details{background:var(--card);border:1px solid var(--line);border-radius:8px}
.lesson details[open]{border-color:var(--gold)}
.lesson summary{cursor:pointer;padding:10px 12px;font-weight:500;list-style:none;display:flex;gap:10px;align-items:baseline}
.lesson summary::-webkit-details-marker{display:none}
.lesson summary .k{font-family:"Noto Serif SC",serif;color:var(--accent);font-size:13px;flex:none}
.lesson summary small{margin-left:auto;color:var(--ink-3);font-weight:400;font-size:12px;flex:none}
.lesson .bd{margin:0 12px 12px;padding-top:8px;border-top:1px dashed var(--line);color:var(--ink-2);font-size:14px}
.lesson .bd p{margin:0 0 8px}.lesson .bd p:last-child{margin:0}
.lesson .bd b{color:var(--ink);font-weight:500}
.lesson .bd .term{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--paper-2);padding:1px 5px;border-radius:4px;color:var(--ink)}
.hist .rt small{display:block;margin:2px 0 0;font-family:"Noto Sans SC",sans-serif;font-weight:400;font-size:11.5px;color:var(--ink-3)}
.pone{margin:0 0 12px;font-family:"Noto Serif SC",serif;font-size:15px;line-height:1.85;color:var(--ink);padding-left:12px;border-left:3px solid var(--gold)}
.pwhat p{margin:0 0 10px;font-size:13.5px;line-height:1.85;color:var(--ink-2)}
.pwhat p:last-child{margin:0}
.pwhat b{color:var(--ink);font-weight:500}
.pterms{margin:14px 0 0;padding-top:12px;border-top:1px dashed var(--line)}
.pterms .ph{font-size:11px;letter-spacing:.12em;color:var(--accent);margin-bottom:6px}
.pterms table{width:100%;border-collapse:collapse;font-size:13px}
.pterms td{padding:4px 8px 4px 0;border-bottom:1px solid var(--line);vertical-align:top}
.pterms td.zh{width:38%;color:var(--ink)}
.pterms td.ru{color:var(--ink-2);font-style:normal}
.pexam{margin:12px 0 0;font-size:12.5px;line-height:1.7;color:var(--ink-3);background:var(--paper-2);border-radius:6px;padding:9px 11px}
.pexam b{display:block;color:var(--accent);font-size:11px;letter-spacing:.1em;margin-bottom:3px;font-weight:500}
label.pdone{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);cursor:pointer;margin-left:auto}
label.pdone input{width:16px;height:16px;margin:0;accent-color:var(--ok)}

.sb .rt small{margin-left:8px;font-family:"Noto Sans SC",sans-serif;font-weight:400;font-size:12px;color:var(--ink-3)}
.sbidea{margin:0 0 12px;font-size:13.5px;line-height:1.8;color:var(--ink-2);padding-left:12px;border-left:3px solid var(--gold)}
.sbp{background:var(--paper-2);border-radius:8px;padding:10px 12px}
.sbph{display:flex;align-items:center;gap:10px;margin-bottom:7px;flex-wrap:wrap}
.sbph span:first-child{font-size:11px;letter-spacing:.12em;color:var(--accent)}
.sbph .btn{padding:4px 12px;font-size:12.5px}
.sbok{font-size:12px;color:var(--ok)}
.sbtext{font-size:12.5px;line-height:1.85;color:var(--ink);white-space:pre-wrap;word-break:break-word;
  background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px;user-select:all}
.sbrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.sbvo,.sblink{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.sbvo b,.sblink b{display:block;font-size:11px;letter-spacing:.1em;color:var(--accent);margin-bottom:5px;font-weight:500}
.sbvo.mute b{color:var(--ink-3)}
.voline{margin:0 0 6px;font-family:"Noto Serif SC","Songti SC",serif;font-size:14.5px;line-height:1.75;color:var(--ink)}
.voline.none{font-family:"Noto Sans SC",sans-serif;font-size:13px;color:var(--ink-3)}
.vonote{margin:6px 0 0;font-size:11.5px;line-height:1.65;color:var(--ink-3)}
.sbvo .btn.ghost{padding:3px 10px;font-size:11.5px}
.sblink p{margin:0;font-size:12.5px;line-height:1.7;color:var(--ink-2)}
.sbmeta{margin-top:10px;font-size:12.5px;line-height:1.75;color:var(--ink-2)}
.sbmeta p{margin:0 0 6px}
.sbmeta p:last-child{margin:0}
.sbmeta b{display:inline-block;min-width:66px;color:var(--accent);font-weight:500;font-size:11px;letter-spacing:.08em;margin-right:6px}
@media (max-width:760px){.sbrow{grid-template-columns:1fr}}

.lens{display:flex;flex-direction:column;gap:8px}
.lens details{background:var(--card);border:1px solid var(--line);border-radius:8px}
.lens details[open]{border-color:var(--gold)}
.lens summary{cursor:pointer;padding:10px 12px;list-style:none;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.lens summary::-webkit-details-marker{display:none}
.lens .lk{font-family:"Noto Serif SC",serif;font-weight:700;font-size:19px;color:var(--accent);flex:none;width:24px}
.lens .ln{font-weight:500;font-size:14px;flex:none}
.lens summary small{color:var(--ink-3);font-weight:400;font-size:12px;flex:1 1 200px;min-width:0}
.lens .bd{margin:0 12px 12px;padding-top:9px;border-top:1px dashed var(--line)}
.lens .raw{margin:0 0 10px;font-family:"Noto Serif SC",serif;font-size:14px;color:var(--ink);line-height:1.7}
.lens .raw span{font-family:"Noto Sans SC",sans-serif;font-size:11px;color:var(--ink-3);margin-left:8px}
.lens .qs b{display:block;font-size:11px;letter-spacing:.1em;color:var(--accent);margin-bottom:4px;font-weight:500}
.lens .qs ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.8;color:var(--ink-2)}
.lens .eg{margin:10px 0 0;font-size:12.5px;color:var(--ink-3);padding-left:10px;border-left:2px solid var(--gold);line-height:1.65}
.lensfoot{margin:10px 0 0;font-size:12.5px;color:var(--ink-3);line-height:1.6}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.step{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:13.5px}
.step b{display:block;font-family:"Noto Serif SC",serif;color:var(--accent);margin-bottom:4px;font-size:14px}
.step.first{border-color:var(--gold)}

.tdlist{display:flex;flex-direction:column;gap:6px}
.td{display:flex;align-items:flex-start;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.td.nowing{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.td.past{opacity:.5}
.td.hw{border-left:3px solid var(--red)}
.td.hw.over{background:var(--red-soft)}
.ttime{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:var(--ink-2);flex:none;padding-top:2px;font-variant-numeric:tabular-nums;min-width:82px}
.td.hw .ttime{min-width:46px;color:var(--red)}
.tmid{flex:1;min-width:0}
.tname{font-size:13.5px;font-weight:500;line-height:1.45}
.tdet{font-size:11.5px;color:var(--ink-3);margin-top:2px;line-height:1.45}
.thw{margin-top:4px;font-size:11.5px;color:var(--red);line-height:1.45}
.td.oneoff{border-style:dashed;border-color:var(--accent)} .td.oneoff .ttime{color:var(--accent)}
.pladd{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap} .pladd input{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:7px 9px;font-size:13px} .pladd input[type=text]{flex:1;min-width:160px} .pladd input[type=date],.pladd input[type=time]{flex:0 0 auto} .pladd .btn{padding:7px 14px}
.plup{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px} .plup .pchip b{cursor:pointer;color:var(--ink-3);margin-left:4px} .plup .pchip b:hover{color:var(--red)}
.thw.ok{color:var(--green)}
.tgo{background:none;border:0;color:var(--ink-3);font-size:17px;line-height:1;padding:0 4px;flex:none;border-radius:4px}
.tgo:hover{color:var(--accent);background:var(--accent-soft)}
.prog{display:flex;flex-wrap:wrap;gap:6px}
.pchip{font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 11px;color:var(--ink-2)}
.pchip.doing{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}

.home .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-align:left;box-shadow:var(--shadow)}
.tile:hover{border-color:var(--accent)}
.tile .k{font-family:"Noto Serif SC",serif;color:var(--accent);font-size:13px;letter-spacing:.1em}
.tile h3{font-size:17px;margin:4px 0 6px}
.tile p{margin:0;font-size:13px;color:var(--ink-2)}
.tile .cnt{margin-top:8px;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.rule{background:var(--accent-soft);border-radius:8px;padding:12px 16px;color:var(--ink);font-size:14px}
.rule b{color:var(--accent)}
.years{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.year{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13.5px}
.year b{display:block;font-family:"Noto Serif SC",serif;color:var(--accent);margin-bottom:4px}
.year.now{border-color:var(--gold)}
.prio{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13.5px}
.prio span{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:3px 9px}
.prio i{color:var(--ink-3);font-style:normal}

.lvt,.seal{position:relative;z-index:1}
.lvhd::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,transparent,var(--qing) 20%,var(--lan) 80%,transparent)}
.seal{flex:none;width:52px;height:52px;border-radius:5px;background:var(--hong);color:var(--bai);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-family:"Noto Serif SC","Songti SC",serif;font-weight:700;font-size:19px;line-height:1;
  letter-spacing:.06em;box-shadow:0 2px 10px rgba(229,71,59,.35)}
.lvt{min-width:0}
.lveye{font-size:11px;letter-spacing:.16em;color:var(--qing);text-transform:uppercase;margin-bottom:3px}
.lvt h2{font-family:"Noto Serif SC","Songti SC",serif;font-size:27px;color:var(--bai);line-height:1.2;margin:0}
.lvpoem{margin:7px 0 0;font-family:"Noto Serif SC","Songti SC",serif;font-size:12.5px;line-height:1.85;color:var(--hui)}
.lvpoem span{color:var(--hui2)}
.lvpoem i{display:inline-block;font-style:normal;font-size:10.5px;color:var(--qing);margin-left:8px;letter-spacing:.1em}
.lvlead{margin:12px 2px 14px;color:var(--hui2);font-size:13px}
.lvlead a{color:var(--qing)}

.lv .ttwrap{border:1px solid var(--bian);background:var(--lan1);box-shadow:inset 3px 0 0 var(--lan)}
.lv .tt th{background:var(--lan3);color:var(--qing);border-bottom:2px solid var(--lan);border-right-color:var(--bian)}
.lv .tt th.today{color:var(--bai)}
.lv .tt th.today::after{content:'今';display:inline-block;margin-left:6px;font-size:10px;
  background:var(--hong);color:var(--bai);border-radius:3px;padding:1px 4px;vertical-align:1px;font-weight:400}
.lv .tt th.rn,.lv .tt td.rn{background:var(--lan2);color:var(--hui2);border-right-color:var(--bian)}
.lv .tt td.cell{border-color:var(--bian);color:var(--hui);background:var(--lan1)}
.lv .tt td.cell.today{background:var(--lan2)}
.lv .tt td.cell:hover,.lv .tt td.cell.today:hover{background:var(--lan3)}
.lv .tt td.cell b{color:var(--bai);font-weight:700}
.lv .tt td.cell .grp{color:var(--qing)}
.lv .tt td.cell .room{color:var(--hui2)}
.lv .tt td.cell a{color:var(--lan)}
.lv .tt td.editing{background:var(--lan1)}
.lv .tt td.editing textarea{background:var(--hei);color:var(--bai);border-color:var(--lan)}

/* 作业：没做＝红（那 10%），做完＝蓝绿（并进 80%） */
.lv .tt td.cell.hw-todo{background:var(--hong2);box-shadow:inset 0 0 0 2px var(--hong),inset 0 0 16px -6px var(--hong)}
.lv .tt td.cell.hw-done{background:var(--lan2);box-shadow:inset 0 0 0 2px var(--qing),inset 0 0 16px -6px var(--qing)}
.lv .tt td.cell.hw-todo:hover,.lv .tt td.cell.hw-done:hover{background:var(--lan3)}
.lv .hwdot{border-color:var(--bian);background:var(--lan2);color:var(--hui2)}
.lv .hwdot.hw-todo{background:var(--hong);border-color:var(--hong);color:var(--bai)}
.lv .hwdot.hw-done{background:var(--qing);border-color:var(--qing);color:var(--hei)}
.lv .hwchip{background:var(--hong);color:var(--bai)}
.lv .hwchip.ok{background:var(--qing);color:var(--hei)}
.lv .hwpanel{background:var(--lan1);border-color:var(--bian);border-left-color:var(--hong)}
.lv .hwpanel.ok{border-left-color:var(--qing)}
.lv .hwwhere{color:var(--bai)}
.lv .hwpanel label{color:var(--hui2)}
.lv label.hwdone{color:var(--hui)}
.lv .hwpanel textarea,.lv .hwpanel input{background:var(--hei);color:var(--bai);border-color:var(--bian)}
.lv .hwpanel.todo .hwnote{color:var(--hong)}
.lv .hwpanel.ok .hwnote{color:var(--qing)}
.lv .hwx{color:var(--hui2)}
.lv .hwx:hover{color:var(--hong);background:var(--hong2)}

.lv .btn{background:var(--lan);color:var(--bai);border:0}
.lv .btn:hover{background:var(--qing);color:var(--hei)}
.lv .btn.ghost{background:none;color:var(--qing);border:1px solid var(--bian)}
.lv .btn.ghost:hover{background:var(--lan2);color:var(--qing)}
.lv .saved{color:var(--qing)}
.lv #tt-manual p{color:var(--hui2)!important}
.lv #tt-manual textarea{background:var(--hei);color:var(--hui);border-color:var(--bian)}
@media (max-width:760px){
  .lv{padding:11px;border-radius:9px}
  .lvhd{padding:13px 14px;gap:12px}
  .seal{width:44px;height:44px;font-size:16px}
  .lvt h2{font-size:22px}
}

.ttwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.tt{border-collapse:collapse;min-width:960px;width:100%;font-size:13px;line-height:1.45;table-layout:fixed}
.tt th{position:sticky;top:0;background:var(--paper-2);font-family:"Noto Serif SC",serif;font-weight:700;font-size:13px;padding:8px 10px;text-align:left;border-bottom:2px solid var(--ink);border-right:1px solid var(--line)}
.tt th.today{color:var(--accent)}
.tt th.rn,.tt td.rn{width:28px;min-width:28px;color:var(--ink-3);font-size:11px;text-align:center;background:var(--paper-2);border-right:1px solid var(--line);font-variant-numeric:tabular-nums}
.tt td.cell{vertical-align:top;padding:8px 10px 20px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);cursor:text;word-break:break-word;min-height:44px;height:44px}
.mvgrip{position:absolute;bottom:3px;right:3px;width:20px;height:16px;border-radius:5px;border:1px solid var(--line);background:var(--card);color:var(--ink-3);font-size:11px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center;opacity:.3;cursor:grab;touch-action:none;letter-spacing:-1px}
.tt td.cell:hover .mvgrip{opacity:.95}
.mvgrip:active{cursor:grabbing}
.tt th.rn .mvgrip,.tt td.rn .mvgrip{position:static;width:20px;height:16px;margin:2px auto 0;opacity:.4}
.tt td.rn:hover .mvgrip{opacity:1}
.rnop{display:block;width:20px;height:16px;margin:3px auto 0;border-radius:5px;border:1px solid var(--line);background:var(--card);color:var(--accent);font-size:12px;line-height:1;padding:0;opacity:.75;cursor:pointer} .rnop.del{color:var(--red)} .tt td.rn:hover .rnop{opacity:1}
.tt td.drop,.tt tr.drop td{outline:2px dashed var(--accent-2);outline-offset:-3px}

<script>
// ---------- 静态内容（来自五年学习表） ----------
const SUBJECTS = [
 {id:'tt', k:'表', name:'课表', desc:'гнесинка · 点格子就能改'},
 {id:'home', k:'首', name:'总览', desc:'规矩、优先级、五年怎么摊'},
 {id:'school', k:'校', name:'学校：歌 · 史 · 乐理', desc:'按课表，老师要的优先', plan:[
   '<b>规矩：</b>学校的课永远排第一。',
   '<b>乐理 / 和声：</b>课上什么，回家当天用自己的话重写一遍，再做几道同类题。考试前两周只复习错题本。不另买一套和学校打架的教材，除非老师指定。',
   '<b>歌剧是史的作业：</b>一周一部或一幕，看完写半页。名单在「歌剧」页。']},
 {id:'ielts', k:'英', name:'英语：雅思', desc:'听读说写轮流，剑桥真题', plan:[
   '<b>每周：</b>听、读、说、写轮流。',
   '<b>大二打底：</b>听简单段、读定位、两周一篇作文。<b>大三：</b>加难、模考。<b>大四：</b>报名考试，够分就停。',

 {id:'russian', k:'俄', name:'商务俄语', desc:'为公司，不是文学', plan:[
   '<b>只背公司会用到的词和句子。</b>每周小本只记会用到的。',
   '<b>练法：</b>拿家里一份真合同或聊天，把关键句抄下来，中俄对照。一周能在真实句子里用上几个新词就算过。']},
 {id:'business', k:'账', name:'账 · 税 · 合同 · 钱', desc:'对着家里真材料看', plan:[
   '<b>税：</b>我们是哪种公司、要报哪些表、网课算什么、给老师钱算工资还是劳务、要不要扣税。',
   '<b>法律：</b>合同四句话——谁和谁、干什么、多少钱、怎么散。请老师来俄能不能合法教。大额和税局的事问会计，你不决定。',
   '<b>管钱：</b>家里公司一张表分清进、出、备用。你自己每月也分：必花、能缓、别动。不管投资课。',
   '<b>下面分了三段。</b>前两段是「此刻就要用」的——税、合同、记账、自己的钱，这些要对着家里的真材料看。第三段是背景知识（经济学、金融常识），不急、不用背、不考试，当消遣看，目的只有一个：以后听到这些词不发懵、能判断对方是真懂还是在唬人。第三段永远排在前两段后面，也排在学校后面。']},
 {id:'computer', k:'电', name:'电脑：VS Code · 表格 · 谷歌', desc:'「研究透」收成会用', plan:[
   '<b>VS Code 先会这几个就够：</b>打开文件夹、左边文件栏、中间编辑、下面终端、保存、查找替换、装中文语言包、装一个表格相关插件、看报错是红波浪。其余按钮用到再查。',
   '<b>谷歌：</b>搜索的引号和减号；邮箱；云端硬盘；文档；表格（和公司账直接相关）；翻译；日历。网站后台用到再学。',
   '<b>五年作品最多两个：</b>课酬表；诗 / 提示词小模板。',
   '<b>下面按 UCC 计算机系（CK401）的科目分了区</b>，你找到的课往对应那一区放。分区不是让你四年全学完——它是一张地图，让你知道自己捡到的东西属于哪一块、哪一块还空着。「工具」那一区优先级最高，剩下的按兴趣来。']},
 {id:'ai', k:'智', name:'AI 专区', desc:'会用 · 懂原理 · 接进公司', plan:[
   '<b>目标不是造模型，是不被「会用 AI 的人」甩开。</b>你有 AI 没有的东西：真实的领域（音乐、俄语环境、家里的业务）、判断力、知道该问什么。原理学到能分辨它什么时候可信就够，剩下的精力放在自己的东西上。',
   '<b>顺序：</b>先「会用」（不用编程，一两个月见效）→ 再「懂原理」（下面的原理小课 + 两个视频）→ 最后「会一点代码」（并进「电脑」页的 VS Code 计划）。',
   '<b>规矩：</b>涉及钱、合同、法规的事，让 AI 起草可以，但要自己核对，或让它联网查并给出处。它输出的是「最像真话的话」，不是「核实过的话」。']},
 {id:'classics', k:'经', name:'四书五经', desc:'先四书后五经 · 每周一小段', plan:[
   '<b>先四书，后五经。</b>四书是朱熹挑出来当入门的，加起来五万多字，一年能读完；五经是更早的原始文献，难得多，尤其《尚书》。次序照朱熹的：<b>大学 → 论语 → 孟子 → 中庸</b>——由浅入深，别一上来读《中庸》。',
   '<b>每周一小段，读原文，白话当拐杖。</b>每本书点开都有「先记这几句」——原文和白话对着排。先念原文，卡住了看白话，再回去念一遍原文。不要只读白话，古文的力气全在原句的节奏里；也不要硬啃，看不懂的地方过去就行。目标不是全懂，是读完一遍知道它讲什么、哪几句是你记得住的。',
   '<b>一条和你有关的：</b>「六经」本来有《乐经》，失传了，所以只剩五经。《诗经》三百篇原本全部是唱的，风是各地民歌、雅是宫廷乐、颂是祭祀乐——现在只剩词，曲子没了。学声乐的人读《诗经》，读的是一部没有谱的歌集。']},
 {id:'mushist', k:'史', name:'音乐史', desc:'七个时期 · 俄中术语对照', plan:[
   '<b>这一页是你学校专业课的骨架。</b>七个时期，一期一页，可以翻。每期四块：这期发生了什么、要记的人和作品、<b>俄中术语对照</b>、常考什么。你在俄语环境上课、用中文思考，术语对照那一栏是这一页最有用的东西——考试写的是俄语词，脑子里想的是中文意思，两边对上才不慌。',
   '<b>和「歌剧」那一页配着用。</b>这边是骨架（时间、流派、术语），那边是血肉（具体看哪一部、记住哪首咏叹调）。复习时先在这边把时期和人名理清楚，再去那边听。',
   '<b>记法：先记框架，再填人。</b>七个时期的顺序和大致年份先背死，然后每期只记两三个代表人物。名字记不住不要紧，「哪个时期、解决了什么问题」比人名重要——考试问「Ars Nova 的革命是什么」比问「维特里生于哪年」多得多。',
   '<b>我整理时改了几处</b>：格里格和埃尔加原稿放在二十世纪，他们其实是浪漫主义（晚期），已归位；Ars Nova 的节奏革命，准确说法是二分节奏取得合法地位（此前只承认象征三位一体的三分），不是「出现了 2/4 和 3/8」。']},
 {id:'politics', k:'政', name:'政治法律', desc:'五个镜头 · 史经政军哲', plan:[
   '<b>这一页的核心是你自己那套方法：史、经、政、军、哲五个镜头。</b>任何一件事——一条新闻、一场谈判、一次涨价、家里公司和合作方的一次拉扯——都拿这五个镜头各过一遍。下面每个镜头点开有「问自己什么」，照着问就行。',
   '<b>先用在小事上。</b>别一上来分析国际局势。先拿身边的事练：为什么这个老师要涨课酬、为什么学校突然改了考试安排、为什么某个合作方一直拖着不签。小事上练熟了，大事才看得准。',
   '<b>目的是看懂，不是站队。</b>五个镜头是用来理解一件事为什么会这样发生的，不是用来给谁定性的。真到了有争议的问题上，值得做的是把各方的理由都摆出来——每一方自己是怎么说的、他们在护什么。你站不站队是另一回事，而且不急。',
   '<b>法律那部分是实用的。</b>你人在莫斯科、家里有跨境业务，居留、劳务合同、开课资质、跨境付款这些迟早碰到。这一段和「账·税·合同·钱」那页打通——那边讲怎么算，这边讲规则是什么。真要拿主意还是问律师和会计。']},
 {id:'poem', k:'诗', name:'古诗词 · 抖音', desc:'让诗词活过来 · 内容工作台', plan:[
   '<b>你的差异化在哪，先说死。</b>讲古诗的号满地都是，绝大多数是「一张山水图 + AI 配音念白话」。你手里有他们没有的三样东西：<b>你真会唱</b>（学院派声乐，发声、气息、咬字都是训练过的）；<b>你懂和声</b>（能自己给词配曲，不是套现成伴奏）；<b>你在莫斯科</b>（一个中国人在异国读中国诗，这个身份本身就是内容）。「让诗词活过来」对你来说不是比喻——词本来就是唱的，你是真能把它唱回来的那种人。',

  one:'音乐不再只是教会的婢女。各声部第一次平等，三度和六度成了正经的协和音程——现代和声的听觉从这里开始。',

   '<b>和中世纪最关键的区别</b>：中世纪是奥尔加农、经文歌、等节奏，各声部功能不平等（tenor 是定旋律 cantus firmus）；文艺复兴是<b>模仿式复调</b>，各声部平等，织体透明。中世纪以五度、八度、同度为主，三度六度只算「不完全协和」；文艺复兴里三度和六度成为正式协和音程，大小调开始萌芽。',
   '<b>勃艮第乐派</b>（约 1420–1470）：中心在勃艮第公爵宫廷。领袖<b>杜费</b>（Гийом Дюфаи，约 1397–1474）——中世纪与文艺复兴之间的桥。三声部弥撒与经文歌，常用世俗曲调作定旋律。',
   '<b>法-佛兰德乐派</b>（1470–1550）：<b>奥克冈</b>（Окегем，1410–1497）复杂的模仿复调、绵长的旋律线；<b>若斯坎·德普雷</b>（Жоскен Депре，1450–1521）——被称作「音乐界的达·芬奇」，模仿技法完美，音乐与文本贴合。',
   '<b>罗马乐派</b>（约 1550–1600）：特伦托会议之后的反宗教改革，要求回到清晰与虔敬。顶峰是<b>帕莱斯特里纳</b>（Палестрина，1525–1594），「帕莱斯特里纳风格」——严格对位、无刺耳不协和、声部进行平稳，成为教会音乐的标准。',
   '<b>威尼斯乐派</b>（约 1550–1610）：创新是<b>多重合唱</b>（多个唱诗班分置于圣马可教堂不同位置）的立体声效果。<b>安德烈亚·加布里埃利</b>与<b>乔瓦尼·加布里埃利</b>大量使用器乐合奏，奠定了配器法的基础。',
   '<b>体裁</b>：圣乐——弥撒（Kyrie、Gloria、Credo、Sanctus、Agnus Dei 五部分）、经文歌。世俗——<b>牧歌</b>（мадригал，意大利，1520–1620，用彼特拉克、塔索的诗，表现力强、有半音化和「词绘」）、<b>尚松</b>（шансон，法国，雅内坎写过《战争》《鸟之歌》这类标题性作品）。器乐开始独立：利切卡尔（предшественница фуги，赋格的前身）、坎佐纳（通往奏鸣曲）、变奏曲、舞曲组曲。'],
  terms:[['模仿式复调','имитационная полифония'],['定旋律','cantus firmus'],['牧歌','мадригал'],['尚松','шансон'],['利切卡尔','ричеркар'],['坎佐纳','канцона'],['无伴奏合唱','а капелла']],
  exam:'常考：三度六度地位的变化；Жоскен 与 Палестрина 的风格差别；威尼斯乐派的多重合唱；мадригал 的词绘手法。'},

 {t:'巴洛克',ru:'Барокко',y:'约 1600 — 1750',
  one:'歌剧诞生。数字低音成为一切合奏的地基，独唱从合唱里站出来——这是你专业的起点。',
  what:[
   '<b>分界线是 1600 年</b>：佩里的《欧律狄刻》（1600）和<b>蒙特威尔第的《奥菲欧》（1607）</b>。从严格对位转向<b>数字低音</b>（генерал-бас / basso continuo）和单声歌调（монодия）：一组乐器（大提琴）奏低音线，另一组（羽管键琴、管风琴或琉特）在上面即兴配和弦。各声部平等让位于「突出旋律」的主调织体，教会调式让位于<b>大小调体系</b>。',
   '<b>美学核心是「情感论」</b>（теория аффектов）：一段音乐应当唤起一种确定的、单一支配性的情绪——悲、怒、英勇、狂喜。加上强烈对比（力度、速度、音色，独奏与乐队的对置）和即兴性（装饰音和数字低音的实现留给演奏者）。',
   '<b>四位开创者</b>：<b>蒙特威尔第</b>（Монтеверди，1567–1643）——歌剧之父，1613 年起任威尼斯圣马可教堂乐长，1637 年参与开办世界第一座公共歌剧院，让歌剧走向大众；代表作《奥菲欧》（1607）、《波佩亚的加冕》（1642，第一部历史题材歌剧）、八卷牧歌。<b>许茨</b>（Шютц，1585–1672）——巴赫之前德国最大的作曲家，两度赴威尼斯，先随乔瓦尼·加布里埃利、后学蒙特威尔第的新风格；把清唱剧与受难曲立在德国。<b>吕利</b>（Люлли，1632–1687）——生在意大利，却成了路易十四宫廷的音乐立法者，创立<b>抒情悲剧</b>（tragédie lyrique）和法国式序曲。<b>珀塞尔</b>（Пёрселл，1659–1695）——只活了 36 岁，《狄多与埃涅阿斯》（1689）是室内歌剧的杰作，狄多的哀歌至今无人超越。',
   '<b>晚期两座高峰</b>：<b>巴赫</b>（1685–1750）——复调的绝对大师，除歌剧外写遍所有巴洛克体裁，《b 小调弥撒》、众赋格与康塔塔。<b>亨德尔</b>（1685–1759）——「效果大师」，46 部歌剧和清唱剧《弥赛亚》。另有<b>维瓦尔第</b>——《四季》，巴洛克器乐的代表。',
   '<b>乐器</b>：小提琴族（小提琴、中提琴、大提琴）最终取代音量较小的维奥尔族；羽管键琴与管风琴是数字低音的主力；双簧管、巴松、竖笛与横笛广泛使用。'],
  terms:[['数字低音','генерал-бас / basso continuo'],['情感论','теория аффектов'],['单声歌调','монодия'],['抒情悲剧','лирическая трагедия'],['清唱剧','оратория'],['受难曲','страсти / пассион'],['羽管键琴','клавесин']],
  exam:'必背：1600 年为界与两部早期歌剧；генерал-бас 是什么、谁演奏；теория аффектов；Люлли 与法国歌剧；巴赫卒年 1750 作为时代终点。'},

 {t:'古典主义',ru:'Классицизм',y:'约 1750 — 1820',
  one:'清晰、匀称、有理性。奏鸣曲式和四乐章套曲在这一时期定型——交响曲、奏鸣曲、协奏曲、弦乐四重奏全是这时候成形的。',
  what:[
   '<b>三个阶段</b>：前古典（约 1730–1760，曼海姆乐派的 Ян Стамиц、柏林乐派的 К.Ф.Э. Бах，放弃数字低音，走向主调织体）；成熟期（约 1770–1790，海顿与早期莫扎特）；晚期（约 1790–1820，贝多芬，已开始向浪漫主义过渡）。',
   '<b>主要特征</b>：<b>主调织体</b>（旋律 + 伴奏）取代复调，复调变成一种对比手段；<b>奏鸣曲式</b>成为器乐的基础——呈示部（两个对比主题、不同调性）→ 展开部（发展与转调）→ 再现部（主题回到主调）；<b>四乐章套曲</b>——第一乐章快板奏鸣曲式，第二乐章慢板（回旋、复三部或变奏），第三乐章小步舞曲（贝多芬改为谐谑曲），第四乐章快速终曲；调性关系清晰（主—属—下属），转调到近关系调；弦乐四重奏（两把小提琴、中提琴、大提琴）和双管编制交响乐队成为标准；<b>钢琴取代羽管键琴</b>。',
   '<b>海顿</b>（Гайдн，1732–1809）——「交响曲之父」，在埃斯特哈齐公爵府供职近三十年。确立古典乐队编制、四乐章套曲、把奏鸣曲式发展成主题的戏剧法。104 部交响曲（尤其「伦敦」93–104）、68 部弦乐四重奏、清唱剧《创世纪》《四季》。',
   '<b>莫扎特</b>（Моцарт，1756–1791）——各体裁的集大成者，维也纳时期（1781–1791）是顶峰。钢琴协奏曲的典范；歌剧改革——《费加罗的婚礼》《唐璜》《魔笛》把音乐与戏剧合为一体，人物是活的。交响曲第 40（g 小调）、第 41「朱庇特」，《安魂曲》（未完成）。',
   '<b>贝多芬</b>（Бетховен，1770–1827）——分三个时期（1802 前 / 1803–1812「英雄」时期 / 1812 后）。扩展了交响曲的规模，用<b>谐谑曲</b>取代小步舞曲，第九交响曲终曲引入合唱（席勒《欢乐颂》）。九部交响曲、32 首钢琴奏鸣曲、五部钢琴协奏曲、歌剧《费德里奥》、《庄严弥撒》。',
   '<b>歌剧改革</b>：<b>格鲁克</b>（Глюк，1714–1787）在《阿尔切斯特》序言（1767）中宣告——音乐应服务于诗，而不是自我炫耀。削减花腔、减少干念宣叙调、序曲要引入戏剧情绪。代表作《奥菲欧与尤丽狄茜》《伊菲革涅亚在奥利德》。正歌剧与趣歌剧互相靠拢，出现<b>歌唱剧</b>（зингшпиль，带对白的德语喜歌剧）——《魔笛》就是。'],
  terms:[['主调织体','гомофония'],['奏鸣曲式','сонатная форма'],['呈示部/展开部/再现部','экспозиция / разработка / реприза'],['小步舞曲','менуэт'],['谐谑曲','скерцо'],['歌唱剧','зингшпиль'],['趣歌剧/正歌剧','опера-буффа / опера-сериа']],
  exam:'必背：сонатная форма 三部分；四乐章套曲各乐章的体裁；贝多芬用 скерцо 换掉 менуэт；Глюк 歌剧改革的三条主张。'},

 {t:'浪漫主义',ru:'Романтизм',y:'约 1815 — 1910',
  one:'音乐变成自白。标题性、民族乐派、艺术歌曲、交响诗——个人情感和民族性压过了形式的匀称。',
  what:[
   '<b>四个阶段</b>：早期（约 1815–1830，舒伯特、韦伯、早期门德尔松，艺术歌曲与钢琴小品成形）；成熟期（约 1830–1850，舒曼、肖邦、李斯特、柏辽兹）；晚期（约 1850–1890，瓦格纳、勃拉姆斯、布鲁克纳、柴可夫斯基、威尔第、「强力集团」）；尾声与转向现代（约 1890–1910，马勒、理查·施特劳斯、西贝柳斯、拉赫玛尼诺夫）。',
   '<b>主要特征</b>：个性与情感崇拜；<b>标题性</b>（программность）——器乐带上文学标题或情节，李斯特由此创出<b>交响诗</b>；<b>民族乐派</b>兴起——俄国「强力集团」、捷克、挪威、芬兰、西班牙、波兰；新体裁——钢琴小品（夜曲、前奏曲、即兴曲、练习曲、圆舞曲、玛祖卡、波洛涅兹、叙事曲）、<b>艺术歌曲</b>（Lied）与声乐套曲、交响诗、乐剧；和声与乐队扩张——半音化、大胆转调、乐队超过百人，加入竖琴、英国管、低音单簧管、大号、钟琴；形式自由化，<b>主导动机</b>（лейтмотив）贯穿发展。',
   '<b>德奥</b>：<b>舒伯特</b>（1797–1828）——歌曲之王，600 余首 Lieder（《魔王》《纺车旁的格蕾卿》），《未完成交响曲》。<b>舒曼</b>（1810–1856）——钢琴套曲《狂欢节》《克莱斯勒偶记》《童年情景》，声乐套曲《诗人之恋》。<b>门德尔松</b>（1809–1847）——复兴巴赫，e 小调小提琴协奏曲，《仲夏夜之梦》（含婚礼进行曲），《无词歌》。<b>瓦格纳</b>（1813–1883）——「乐剧」改革：主导动机、无尽旋律、取消咏叹调与宣叙调的界限；《尼伯龙根的指环》四联剧、《特里斯坦与伊索尔德》（「特里斯坦和弦」是调性的临界点）、《帕西法尔》。<b>勃拉姆斯</b>（1833–1897）——用古典形式装浪漫情感，四部交响曲、《德意志安魂曲》。<b>布鲁克纳</b>、<b>马勒</b>（1860–1911，交响曲如一个「世界」，第二「复活」、第八「千人」）。',
   '<b>法国</b>：<b>柏辽兹</b>（1803–1869）——《幻想交响曲》（标题性，「固定乐思」即主导动机的雏形），写了配器法教程。<b>圣桑</b>、<b>比才</b>（《卡门》）。',
   '<b>意大利歌剧</b>：<b>罗西尼</b>（《塞维利亚理发师》）、<b>贝利尼</b>（《诺尔玛》，美声长线条）、<b>唐尼采蒂</b>（《拉美莫尔的露琪亚》）——美声三杰；<b>威尔第</b>（1813–1901）——《弄臣》《茶花女》《阿依达》《奥赛罗》《法尔斯塔夫》；<b>普契尼</b>（1858–1924）——真实主义（веризм），《波希米亚人》《托斯卡》《蝴蝶夫人》《图兰朵》。',
   '<b>俄罗斯——你在莫斯科，这一段最要紧</b>：<b>格林卡</b>（1804–1857）俄罗斯古典音乐奠基人，《为沙皇献身》（即《伊凡·苏萨宁》）、《鲁斯兰与柳德米拉》。<b>「强力集团」</b>（Могучая кучка：巴拉基列夫、穆索尔斯基、鲍罗丁、里姆斯基-科萨科夫、居伊）——依托民歌与东方色彩：穆索尔斯基《鲍里斯·戈杜诺夫》《图画展览会》；鲍罗丁《伊戈尔王》、第二「勇士」交响曲；里姆斯基《舍赫拉查德》与童话歌剧《雪姑娘》《萨特阔》。<b>柴可夫斯基</b>（1840–1893）——第四、五、六「悲怆」交响曲，第一钢琴协奏曲，芭蕾《天鹅湖》《胡桃夹子》《睡美人》，歌剧《叶甫盖尼·奥涅金》《黑桃皇后》。',
   '<b>其他民族乐派</b>：波兰<b>肖邦</b>（1810–1849，钢琴诗人）；匈牙利<b>李斯特</b>（1811–1886，交响诗的创立者，《匈牙利狂想曲》，b 小调奏鸣曲）；捷克<b>斯美塔那</b>（《我的祖国》含《伏尔塔瓦河》）、<b>德沃夏克</b>（第九「自新大陆」）；挪威<b>格里格</b>（《培尔·金特》）；芬兰<b>西贝柳斯</b>（《芬兰颂》）；英国<b>埃尔加</b>（《谜语变奏曲》）。'],
   terms:[['标题性','программность'],['交响诗','симфоническая поэма'],['艺术歌曲','песня / Lied'],['声乐套曲','песенный цикл'],['主导动机','лейтмотив'],['乐剧','музыкальная драма'],['真实主义','веризм'],['强力集团','Могучая кучка']],
  exam:'必背：программность 与 симфоническая поэма（李斯特）；лейтмотив 与瓦格纳；Могучая кучка 五人及代表作；柴可夫斯基三大芭蕾。注意：格里格和埃尔加常被误放进二十世纪，他们属于浪漫主义（晚期）。'},

  {t:'传五章',s:'释「格物致知」· 原文残缺',
   y:'此谓知本。此谓知之至也。\n〔朱熹补传〕所谓致知在格物者，言欲致吾之知，在即物而穷其理也。盖人心之灵莫不有知，而天下之物莫不有理，惟于理有未穷，故其知有不尽也。是以大学始教，必使学者即凡天下之物，莫不因其已知之理而益穷之，以求至乎其极。至于用力之久，而一旦豁然贯通焉，则众物之表里精粗无不到，而吾心之全体大用无不明矣。此谓物格，此谓知之至也。',
   b:'这就叫懂得根本。这就叫知识达到了极点。\n〔朱熹补写的一段〕所谓「求知通达在于穷究事物之理」，是说想让自己的知识通达，就要接触具体事物、把它的道理穷究到底。人心天生就有认知能力，天下万物也都各有其理，只因为理还没穷究透，所以知还不完全。因此大学一开始教人，必定让学生就天下万物，顺着已经知道的道理再往深处推究，一直求到尽头。用功久了，有一天忽然贯通，那么万物的表里精粗没有达不到的，自己心里的全部能力也没有不明白的。这就叫「物格」，这就叫「知之至」。',

  {t:'传六章',s:'释「诚意」· 慎独',
   y:'所谓诚其意者，毋自欺也。如恶恶臭，如好好色，此之谓自谦。故君子必慎其独也。\n小人闲居为不善，无所不至，见君子而后厌然，揜其不善，而著其善。人之视己，如见其肺肝然，则何益矣。此谓诚于中，形于外，故君子必慎其独也。\n曾子曰：「十目所视，十手所指，其严乎！」\n富润屋，德润身，心广体胖，故君子必诚其意。',
   b:'所谓使意念真诚，就是不要自己骗自己。像厌恶臭味那样自然地厌恶恶，像喜爱美色那样自然地喜爱善，这才叫自我满足。所以君子一个人独处时也必定谨慎。\n小人独处时做不好的事，什么都干得出来，见了君子才躲躲闪闪，遮住自己的坏、摆出自己的好。可别人看你，就像看见你的肺肝一样，那又有什么用？这就叫内心真实，会显露在外表上，所以君子一个人独处时也必定谨慎。\n曾子说：「十只眼睛盯着，十只手指着，多么可畏啊！」\n财富能装点屋子，德行能润泽自身，心胸宽广，身体自然舒泰，所以君子必定使自己的意念真诚。',
   n:'「慎独」出自这里。「恶恶臭」前一个恶读 wù（厌恶），后一个读 è；「好好色」前一个好读 hào。「心广体胖」的「胖」读 pán，是安舒的意思，不是胖瘦。'},
  {t:'传七章',s:'释「正心修身」',
   y:'所谓修身在正其心者，身有所忿懥，则不得其正；有所恐惧，则不得其正；有所好乐，则不得其正；有所忧患，则不得其正。\n心不在焉，视而不见，听而不闻，食而不知其味。\n此谓修身在正其心。',
   b:'所谓修养自身在于端正心念：心里有愤怒，心就不正；有恐惧，心就不正；有偏好贪恋，心就不正；有忧虑，心就不正。\n心思不在这里，看了等于没看见，听了等于没听见，吃东西也尝不出味道。\n这就叫修养自身在于端正心念。',
   n:'「心不在焉，视而不见，听而不闻」出自这里。忿懥读 fèn zhì。'},
  {t:'传八章',s:'释「修身齐家」',
   y:'所谓齐其家在修其身者，人之其所亲爱而辟焉，之其所贱恶而辟焉，之其所畏敬而辟焉，之其所哀矜而辟焉，之其所敖惰而辟焉。\n故好而知其恶，恶而知其美者，天下鲜矣。\n故谚有之曰：「人莫知其子之恶，莫知其苗之硕。」\n此谓身不修不可以齐其家。',
   b:'所谓整顿家庭在于修养自身：人对自己亲爱的人会有偏向，对自己轻贱厌恶的人会有偏向，对自己敬畏的人会有偏向，对自己同情的人会有偏向，对自己怠慢的人会有偏向。\n所以，喜欢一个人还能看见他的缺点、厌恶一个人还能看见他的好处，这样的人天下少有。\n所以谚语说：「没有人觉得自己的孩子不好，没有人觉得自己的庄稼长得够壮。」\n这就叫自身不修养好，就没法整顿家庭。',
   n:'「辟」读 pì，偏颇、偏向。这一章讲的是我们今天说的「偏见」——感情会让判断失真。'},
  {t:'传九章',s:'释「齐家治国」· 节选',
   y:'所谓治国必先齐其家者，其家不可教而能教人者，无之。故君子不出家而成教于国：孝者，所以事君也；弟者，所以事长也；慈者，所以使众也。\n《康诰》曰：「如保赤子。」心诚求之，虽不中不远矣。未有学养子而后嫁者也。\n一家仁，一国兴仁；一家让，一国兴让；一人贪戾，一国作乱：其机如此。此谓一言偾事，一人定国。\n尧舜率天下以仁，而民从之；桀纣率天下以暴，而民从之。其所令反其所好，而民不从。是故君子有诸己而后求诸人，无诸己而后非诸人。\n所藏乎身不恕，而能喻诸人者，未之有也。故治国在齐其家。',
   b:'所谓治国必先整顿好家：连自己家都教不好却能教好别人的，没有这种人。所以君子不出家门就能把教化推行到国中：孝，是用来侍奉君主的；悌，是用来侍奉长辈的；慈，是用来役使民众的。\n《康诰》说：「像保护婴儿一样。」内心真诚地去求，即使不完全中，也不会差太远。没有人是先学会养孩子才出嫁的。\n一家仁爱，一国就兴起仁爱；一家谦让，一国就兴起谦让；一个人贪婪暴戾，一国就作乱：关键就在这里。这就叫一句话能坏事，一个人能安定国家。\n尧舜用仁率领天下，百姓就跟着仁；桀纣用暴率领天下，百姓就跟着暴。如果命令与自己的好恶相反，百姓就不服从。所以君子先自己做到了再要求别人，自己身上没有那毛病再去批评别人。\n自身藏着的做法都不合恕道，却想让别人明白，从来没有过。所以治国在于整顿好自己的家。',
   n:'节选：原章后面还引了《诗经》「桃之夭夭」「宜兄宜弟」「其仪不忒」三段。全文在上面「全文」那条链接里。'},
  {t:'传十章',s:'释「治国平天下」· 絜矩之道 · 节选',
   y:'所谓平天下在治其国者，上老老而民兴孝，上长长而民兴弟，上恤孤而民不倍，是以君子有絜矩之道也。\n所恶于上，毋以使下；所恶于下，毋以事上；所恶于前，毋以先后；所恶于后，毋以从前；所恶于右，毋以交于左；所恶于左，毋以交于右。此之谓絜矩之道。\n是故君子先慎乎德。有德此有人，有人此有土，有土此有财，有财此有用。\n德者本也，财者末也。外本内末，争民施夺。是故财聚则民散，财散则民聚。\n生财有大道：生之者众，食之者寡，为之者疾，用之者舒，则财恒足矣。\n仁者以财发身，不仁者以身发财。',
   b:'所谓平定天下在于治好自己的国：在上位的人敬重老人，百姓就兴起孝；在上位的人尊敬长辈，百姓就兴起悌；在上位的人体恤孤弱，百姓就不背弃。所以君子有「絜矩之道」。\n你厌恶上级对你的那种做法，就不要用它对待下级；厌恶下级对你的做法，就不要用它侍奉上级；厌恶前人对你的做法，就不要用它对待后人；厌恶后人对你的做法，就不要用它对待前人；厌恶右边人的做法，就不要用它对待左边；厌恶左边人的做法，就不要用它对待右边。这就叫絜矩之道。\n所以君子首先谨慎地修德。有德才有人归附，有人才有土地，有土地才有财富，有财富才有用度。\n德是根本，财是枝末。把根本放在外面、把枝末放在里面，就是教百姓相争相夺。所以财聚拢在上位者手里，百姓就离散；财散给百姓，百姓就聚拢过来。\n生财有大原则：生产的人多，消耗的人少，干活的人勤快，花用的人从容，财就总是够的。\n仁者用财富来成就自身，不仁的人用自身去换财富。',
   n:'节选：这是最长的一章，原章还有大段引《诗》《书》和论用人、论理财。「絜矩」读 xié jǔ——絜是量度，矩是曲尺，合起来就是「拿自己这把尺去量别人的处境」，和「己所不欲，勿施于人」是一个意思。'},
 ]},
 lunyu:{sub:'先录《学而第一》全篇十六章。《论语》共二十篇，其余各篇陆续加。',chapters:[
  {t:'学而 1',s:'全书开篇',
   y:'子曰：「学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？」',
   b:'孔子说：「学了又按时去实践它，不也高兴吗？有志同道合的人从远方来，不也快乐吗？别人不了解我，我也不怨恨，不正是君子吗？」',
   n:'「说」读 yuè，同「悦」。「习」不只是复习，是练习、实行——像练声一样。'},
  {t:'学而 2',s:'孝弟为仁之本',
   y:'有子曰：「其为人也孝弟，而好犯上者，鲜矣；不好犯上，而好作乱者，未之有也。君子务本，本立而道生。孝弟也者，其为仁之本与！」',
   b:'有子说：「一个人孝顺父母、敬爱兄长，却喜欢冒犯上级，这样的人少见；不喜欢冒犯上级，却喜欢作乱，这样的人从来没有。君子专力于根本，根本立住了，道就生出来了。孝和悌，大概就是仁的根本吧！」',
   n:'「弟」读 tì，同「悌」。「鲜」读 xiǎn，少。有子即有若，孔子弟子。'},
  {t:'学而 3',s:'巧言令色',
   y:'子曰：「巧言令色，鲜矣仁！」',
   b:'孔子说：「说话动听、脸色讨好，这种人很少有仁。」',
   n:'全书最短的一章之一，《论语》里出现了两次。'},
  {t:'学而 4',s:'三省吾身',
   y:'曾子曰：「吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？」',
   b:'曾子说：「我每天多次反省自己：替别人办事有没有不尽心？和朋友交往有没有不守信？老师传授的有没有去实践？」',
   n:'「三省」的三，多数解为「多次」，不一定是三件事。省读 xǐng。'},
  {t:'学而 5',s:'治国五事',
   y:'子曰：「道千乘之国，敬事而信，节用而爱人，使民以时。」',
   b:'孔子说：「治理一个拥有千辆兵车的国家，要认真办事、讲信用，节省开支、爱护他人，役使百姓要避开农时。」',
   n:'「道」在这里同「导」，治理。「使民以时」——别在该种地的时候征人干活。'},
  {t:'学而 6',s:'行有余力，则以学文',
   y:'子曰：「弟子入则孝，出则弟，谨而信，泛爱众，而亲仁。行有余力，则以学文。」',
   b:'孔子说：「年轻人在家孝顺父母，出门敬爱兄长，做事谨慎而守信，广泛地关爱众人，亲近有仁德的人。这些做了还有余力，再去学文献典籍。」',
   n:'孔子把做人放在读书前面。'},
  {t:'学而 7',s:'虽曰未学，吾必谓之学矣',
   y:'子夏曰：「贤贤易色；事父母，能竭其力；事君，能致其身；与朋友交，言而有信。虽曰未学，吾必谓之学矣。」',
   b:'子夏说：「尊崇贤德而不重容貌；侍奉父母能尽力；侍奉君主能豁出自己；和朋友交往说话算话。这样的人即使说自己没读过书，我一定说他已经学过了。」',
   n:'「贤贤易色」历来有争议，另一解是「对妻子重德行而不重美貌」。'},
  {t:'学而 8',s:'过则勿惮改',
   y:'子曰：「君子不重则不威，学则不固。主忠信。无友不如己者。过则勿惮改。」',
   b:'孔子说：「君子不庄重就没有威信，所学也不稳固。以忠和信为主。不要和与自己不同道的人做朋友。有了过错，不要怕改。」',
   n:'「无友不如己者」直译是「不要和不如自己的人交朋友」，但那样人人都没朋友了，所以通常解为「不和不同道的人交朋友」。'},
  {t:'学而 9',s:'慎终追远',
   y:'曾子曰：「慎终追远，民德归厚矣。」',
   b:'曾子说：「谨慎地办好丧事，虔诚地祭祀远祖，百姓的德行就会归于淳厚。」',
   n:''},
  {t:'学而 10',s:'温良恭俭让',
   y:'子禽问于子贡曰：「夫子至于是邦也，必闻其政，求之与？抑与之与？」\n子贡曰：「夫子温、良、恭、俭、让以得之。夫子之求之也，其诸异乎人之求之与？」',
   b:'子禽问子贡：「老师每到一个国家，必定能了解到那里的政事，是他自己求来的呢，还是别人主动告诉他的？」\n子贡说：「老师是靠温和、善良、恭敬、节俭、谦让得来的。老师求的方式，大概和别人求的方式不一样吧？」',
   n:'「温良恭俭让」出自这里。句末的「与」都读 yú，同「欤」。'},
  {t:'学而 11',s:'三年无改于父之道',
   y:'子曰：「父在，观其志；父没，观其行；三年无改于父之道，可谓孝矣。」',
   b:'孔子说：「父亲在世时，看他的志向；父亲去世后，看他的行为；三年不改变父亲的行事之道，可以说是孝了。」',
   n:'「没」读 mò，去世。这一章后世争议很大——「不改」到底指什么，历代注家说法不一。'},
  {t:'学而 12',s:'礼之用，和为贵',
   y:'有子曰：「礼之用，和为贵。先王之道，斯为美；小大由之。有所不行，知和而和，不以礼节之，亦不可行也。」',
   b:'有子说：「礼的运用，以和谐为贵。先王之道，美就美在这里；大事小事都照这个来。但也有行不通的时候：只知道一味求和谐，不用礼来节制它，那也是行不通的。」',
   n:'「和为贵」出自这里。后半句常被忽略——和谐不是无原则的一团和气。'},
  {t:'学而 13',s:'信近于义',
   y:'有子曰：「信近于义，言可复也。恭近于礼，远耻辱也。因不失其亲，亦可宗也。」',
   b:'有子说：「许下的承诺合于义，说过的话才能兑现。恭敬合于礼，才能远离耻辱。所依靠的是可亲可信的人，也就值得效法了。」',
   n:'「复」是实践、兑现。意思是：不合道义的承诺，本来就不该许。'},
  {t:'学而 14',s:'敏于事而慎于言',
   y:'子曰：「君子食无求饱，居无求安，敏于事而慎于言，就有道而正焉，可谓好学也已。」',
   b:'孔子说：「君子吃不求饱足，住不求安逸，做事勤快而说话谨慎，主动靠近有道的人来端正自己，这就可以说是好学了。」',
   n:'孔子说的「好学」，标准是做事和做人，不是读了多少书。'},
  {t:'学而 15',s:'如切如磋，如琢如磨',
   y:'子贡曰：「贫而无谄，富而无骄，何如？」\n子曰：「可也。未若贫而乐，富而好礼者也。」\n子贡曰：「《诗》云：『如切如磋，如琢如磨。』其斯之谓与？」\n子曰：「赐也，始可与言《诗》已矣！告诸往而知来者。」',
   b:'子贡说：「穷而不谄媚，富而不骄横，怎么样？」\n孔子说：「可以了。但还不如穷而快乐、富而好礼。」\n子贡说：「《诗经》上说『如切如磋，如琢如磨』，说的就是这个意思吧？」\n孔子说：「赐啊，现在可以和你谈《诗》了！告诉你前面的，你能推知后面的。」',
   n:'「赐」是子贡的名。这一章正好接上《大学》传三章引的同一句《诗》——两本书对读，是同一个典故。'},
  {t:'学而 16',s:'患不知人',
   y:'子曰：「不患人之不己知，患不知人也。」',
   b:'孔子说：「不愁别人不了解我，愁的是我不了解别人。」',
   n:'和开篇「人不知而不愠」首尾呼应——《学而》一篇是围起来的。'},
 ]},
};

async function supaFetch(path,opt,retried){

  let r; try{ r=await fetch(SUPA.url+path,Object.assign({},opt,{signal:ac.signal})); }

const supaNow=()=>new Date(Date.now()+supaOffset).toISOString();
function makeSupaDb(){
  const subs=[]; const cache={}; let since='1970-01-01T00:00:00+00:00'; let timer=null, pulling=false;
  const snapFor=col=>{ const o=cache[col]||{}; return {docs:Object.keys(o).map(id=>({id,data:()=>o[id]}))}; };
  const docSnap=(col,id)=>{ const o=cache[col]||{}; return {exists:o[id]!==undefined,data:()=>o[id]}; };
  function notify(cols,all){
    for(const s of subs){ if(!all&&!cols.has(s.col)) continue;
      try{ s.cb(s.id?docSnap(s.col,s.id):snapFor(s.col)); }catch(e){console.warn(e);} }
  }
  async function pull(full){
    if(pulling) return; pulling=true;
    try{
      const q='/rest/v1/docs?select=col,id,data,updated_at&order=updated_at.asc&limit=1000'+(full?'':'&updated_at=gt.'+encodeURIComponent(since));
      const rows=await (await supaFetch(q,{headers:supaHeaders()})).json();
      const changed=new Set();
      for(const row of rows){ cache[row.col]=cache[row.col]||{};
        if(row.data==null) delete cache[row.col][row.id]; else cache[row.col][row.id]=row.data;
        changed.add(row.col); if(row.updated_at>since) since=row.updated_at; }
      if(rows.length||full) notify(changed,full);
      syncMsg('已同步 · '+new Date().toTimeString().slice(0,5));
      return rows.length;
    }catch(e){ syncMsg('⚠ 连不上数据库（'+(e.code||'网络')+'）——改动先存在本机，连上后再存一次'); throw e; }
    finally{ pulling=false; }
  }
  function schedule(ms){ clearTimeout(timer); timer=setTimeout(()=>{ pull(false).catch(()=>{}).then(()=>schedule(15000)); }, ms); }
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) schedule(300); });
  window.addEventListener('focus',()=>schedule(300));
  async function upsert(rows){
    await supaFetch('/rest/v1/docs',{method:'POST',headers:supaHeaders({Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify(rows)});
    schedule(1500);
  }
  const split=p=>{ const i=p.indexOf('/'); return [p.slice(0,i),p.slice(i+1)]; };
  const dbo={
    collection(col){ return { onSnapshot(cb,err){ subs.push({col,cb,err}); if(cache[col]) cb(snapFor(col)); } }; },
    doc(path){ const [col,id]=split(path); return {
      onSnapshot(cb,err){ subs.push({col,id,cb,err}); if(cache[col]&&cache[col][id]!==undefined) cb(docSnap(col,id)); },
      async set(data){ cache[col]=cache[col]||{}; cache[col][id]=data; await upsert([{col,id,data,updated_at:supaNow()}]); },
      async delete(){ if(cache[col]) delete cache[col][id]; await upsert([{col,id,data:null,updated_at:supaNow()}]); },
    }; },
    async start(){
      let n;
      try{ n=await pull(true); }
      catch(e){ syncMsg('⚠ 连不上数据库（'+(e.code||'网络')+'），10 秒后自动重试…'); setTimeout(()=>dbo.start().catch(()=>{}),10000); return; }
      if(n===0&&SEED){ // 空库：把出厂那份灌进去
        const rows=[]; const t=supaNow();
        for(const c of Object.keys(SEED)){ if(c==='timetable'||!SEED[c]) continue;
          for(const [id,data] of Object.entries(SEED[c])) rows.push({col:c,id,data,updated_at:t}); }
        if(SEED.timetable) rows.push({col:'timetable',id:'main',data:SEED.timetable,updated_at:t});
        for(let i=0;i<rows.length;i+=100) await upsert(rows.slice(i,i+100));
        await pull(true); syncMsg('第一次连上，已把 '+rows.length+' 条数据搬进你的数据库');
      }
      try{ ensureAutoCourses(); ensureSunday(); ensureStudyRow(); }catch(e){ console.warn(e); }
      schedule(15000);
    },
  };
  return dbo;
}

// 把课表格子拆成 时间 / 课名 / 教室，用来做「今天」
const TIME_RE=/^(\d{1,2})\s*[:.：]\s*(\d{2})\s*(?:[-–—~]\s*(\d{1,2})\s*[:.：]\s*(\d{2}))?/;
function parseTTCell(text){
  const raw=String(text||'').trim(); if(!raw) return null;
  const lines=raw.split('\n').map(s=>s.trim()).filter(Boolean); if(!lines.length) return null;
  const m=lines[0].match(TIME_RE); if(!m) return null;
  if(/^https?:\/\//i.test(lines[0])) return null;
  const pad=n=>String(n).padStart(2,'0');
  const s=Number(m[1])*60+Number(m[2]);
  const time=m[3]?`${pad(m[1])}:${m[2]}–${pad(m[3])}:${m[4]}`:`${pad(m[1])}:${m[2]}`;
  const noUrl=x=>x.replace(/https?:\/\/\S+/gi,'').trim();
  let title=noUrl(lines[0].slice(m[0].length)).replace(/^[·\-–—]\s*/,'');
  let detail=lines.slice(1).map(noUrl).filter(Boolean).join(' · ');
  if(!title&&detail){title=detail;detail='';}
  return {s,time,title:title||'课',detail};
}
function todayClasses(){
  const t=ttData(), days=t.days||[], rows=t.rows||[];
  const idx=(new Date().getDay()+6)%7;
  if(idx>=days.length) return {name:'周日',idx,items:[]};
  const items=[];
  for(let r=0;r<rows.length;r++){
    const p=parseTTCell((rows[r]||[])[idx]); if(!p) continue;
    p.hw=mem.hw[hwKey(r,idx)]||null; p.r=r; p.c=idx;
    const ck=csKindOf((rows[r]||[])[idx]); if(ck){ const tr=csTrackOn(ck); p.detail=tr.name+' · '+tr.wk; }
    items.push(p);
  }
  items.sort((a,b)=>a.s-b.s);
  return {name:days[idx],idx,items};
}
function allUndoneHw(){
  const t=ttData(), days=t.days||[];
  return Object.entries(mem.hw)
    .filter(([,v])=>v&&(v.text||'').trim()&&!v.done)
    .map(([k,v])=>{const [r,c]=k.split('-').map(Number);
      const cell=parseTTCell(((t.rows[r]||[])[c])||'');
      return {k,r,c,text:v.text,due:v.due||'',day:days[c]||'',cls:cell?cell.title:''};})
    .sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));
}

// 「电脑」页顶上：本周该碰哪一门 · 几小时 · 上次停在哪
function isoWeek(d){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));
  const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return t.getUTCFullYear()+'-W'+String(Math.ceil(((t-y0)/864e5+1)/7)).padStart(2,'0');
}
function csPick(){
  const out=[];
  for(const [id,c] of bySubj('courses','computer')){
    const syl=SYLLABI[id]; if(!syl) continue;
    const d=sylDone(id);
    const i=syl.weeks.findIndex((_,k)=>!d[k]);
    out.push({id,c,syl,i,
      score:(c.status==='doing'?0:c.status==='done'?2:1)+(i<0?10:0),
      t:c.createdAt||''});          // 先加进来的算主线
  }
  out.sort((a,b)=>a.score-b.score||a.t.localeCompare(b.t));
  return out;
}
function csLastNote(){
  let out=null;
  for(const [id] of bySubj('courses','computer')){
    const syl=SYLLABI[id]; if(!syl) continue;
    const n=sylNotes(id);
    for(const k of Object.keys(n)){
      const i=Number(k); if(!n[k]||!n[k].trim()) continue;
      if(!out||i>out.i) out={id,i,syl,text:n[k].trim()};
    }
  }
  return out;
}
function renderCsWeek(){
  const wk=isoWeek(new Date());
  const log=mem.hist.csweek||{};
  const mins=(log.iso===wk?Number(log.mins):0)||0;
  const target=Number(log.target)||960;
  const picks=csPick(), pick=picks[0], side=picks.find(x=>x!==pick&&x.score<2&&x.i>=0), last=csLastNote();
  const pct=Math.min(100,Math.round(mins/target*100));
  const hm=m=>(m%60? (m/60).toFixed(1).replace(/\.0$/,'') : m/60)+' 小时';
  let line1;
  if(!pick) line1='<span class="v"><em>还没把带大纲的课放进来。下面「课程与资源」加一门，CS50P 和 freeCodeCamp 会自动带出一周一讲的大纲。</em></span>';
  else if(pick.i<0) line1='<span class="v done">'+esc(pick.syl.name.split(' · ')[0])+' 全部做完了。挑下一门吧。</span>';
  else line1='<span class="v"><b style="font-weight:600">'+esc(pick.syl.name.split(' · ')[0])+'</b> · '+esc(pick.syl.weeks[pick.i].t)
    +(sylWatch(pick.id)[pick.i]?'<em>（讲座看完了，差作业）</em>':'')
    +(side?'<em>　副线：'+esc(side.syl.name.split(' · ')[0])+' · '+esc(side.syl.weeks[side.i].t)+'</em>':'')+'</span>'
    +'<button class="btn" data-csgo="'+pick.id+':'+pick.i+'">去这一周</button>';
  return `<div class="csweek">
   <div class="cshd">本周怎么摊</div>
   <div class="csw"><b>该碰哪一门</b>${line1}</div>
   <div class="csw"><b>几小时</b>
     <span class="v">${hm(mins)} <em>/ 本周目标</em>
       <select data-cstarget="1">${[120,180,240,300,360,420,480,720,960].map(v=>`<option value="${v}" ${v===target?'selected':''}>${v/60} 小时</option>`).join('')}</select>
     </span>
     <span class="csbar"><i style="width:${pct}%"></i></span>
     <button class="mini" data-cslog="30">+30 分</button>
     <button class="mini" data-cslog="60">+1 小时</button>
     ${mins?'<button class="mini" data-cslog="0">清零</button>':''}
   </div>
   <div class="csw"><b>上次停在哪</b>${last
     ? `<span class="v">${esc(last.syl.name.split(' · ')[0])} · ${esc(last.syl.weeks[last.i].t)}：${esc(last.text.split('\n')[0].slice(0,60))}${last.text.length>60?'…':''}</span>`
     : '<span class="v"><em>还没写过周笔记。展开任何一周，最下面那个框写一句，下次回来就知道自己停在哪了。</em></span>'}</div>
  </div>`;
}

const BACKUP_COLS=['courses','notes','operas','words','classics','syllabus','hw','hist','shots','enwords','enlearn','plans'];
function dumpAll(){
  const o={_app:'五年学习本',_at:now(),timetable:mem.timetable||null};
  for(const c of BACKUP_COLS) o[c]=mem[c]||{};
  return o;
}
function backupName(){ return '五年学习本-备份-'+now().slice(0,10)+'.json'; }
function doExport(){
  const txt=JSON.stringify(dumpAll(),null,1);
  // 云端版（artifact 里）不让网页直接下载文件，所以改成「选中 + 复制」
  if(false){
    const ta=document.getElementById('bk-json'), box=document.getElementById('bk-manual');
    if(ta&&box){ box.hidden=false; ta.value=txt; ta.focus(); ta.select();
      const ok=()=>bkMsg('已复制（'+Math.round(txt.length/1024)+' KB）。粘到一个 .json 文件里存着，或者直接喂给离线版。');
      try{ navigator.clipboard.writeText(txt).then(ok,()=>bkMsg('文字已选中，自己拷走（Ctrl+C）。')); }
      catch(e){ bkMsg('文字已选中，自己拷走（Ctrl+C）。'); }
    }
    return;
  }
  try{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));
    a.download=backupName(); document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
    bkMsg('已导出 '+backupName()+'（在「下载」里）');
  }catch(e){
    const ta=document.getElementById('bk-json'); const box=document.getElementById('bk-manual');
    if(ta&&box){box.hidden=false;ta.value=txt;ta.focus();ta.select();bkMsg('浏览器不让直接下载——文字已选中，自己拷走。');}
  }
}
async function doImport(txt){
  let d; try{ d=JSON.parse(txt); }catch(e){ bkMsg('这不是备份文件（JSON 读不出来）。',true); return; }
  if(!d||typeof d!=='object'){ bkMsg('文件是空的。',true); return; }
  let n=0;
  if(d.timetable&&d.timetable.rows){ await ttSave(d.timetable); n++; }
  for(const c of BACKUP_COLS){
    const box=d[c]; if(!box||typeof box!=='object') continue;
    for(const [id,v] of Object.entries(box)){ if(!v||typeof v!=='object') continue; await store.set(c,id,v); n++; }
  }
  bkMsg('导入完成，写进去 '+n+' 条。'+(db?'（已同步到云端）':'（存在这台设备里）'));
}

function renderCourseList(sid,courses,stName){
  const areas=AREAS[sid];
  if(!areas) return `<div class="list">${courses.map(([id,c])=>courseItem(id,c,stName,false)).join('')}
    ${courses.length?'':'<div class="empty">还没放课程。找到了就填在下面：名字、链接、一句话为什么选它。</div>'}</div>`;
  const out=[];
  for(const yr of (STAGES[sid]||YEARS)){
    const yAreas=areas.filter(a=>a.y===yr.y); if(!yAreas.length) continue;
    const yCount=courses.filter(([,c])=>yAreas.some(a=>a.k===c.area)).length;
    out.push(`<div class="yr"><div class="yrh"><span class="yn">${esc(yr.n)}</span><span class="ycnt">${yCount||''}</span></div><div class="yt">${esc(yr.t)}</div></div>`);
    for(const a of yAreas){
      const mine=courses.filter(([,c])=>c.area===a.k);
      out.push(`<div class="grp ${mine.length?'':'thin'}">
        <div class="grph"><span class="gn">${esc(a.n)}</span>${a.c?`<span class="gc">${esc(a.c)}</span>`:''}<span class="gcnt">${mine.length||''}</span></div>
        <div class="gd">${esc(a.d)}</div>
        ${mine.length?`<div class="list">${mine.map(([id,c])=>courseItem(id,c,stName,false)).join('')}</div>`:''}
      </div>`);
    }
  }
  const rest=courses.filter(([,c])=>!c.area||!areaOf(sid,c.area));
  if(rest.length) out.push(`<div class="grp"><div class="grph"><span class="gn">还没分区</span><span class="gcnt">${rest.length}</span></div>

  return `<div class="grps">${out.join('')}</div>`;
}

async function doAsk(sid){
  const cfg=ASK[sid]; const ta=document.getElementById('ask-q-'+sid); if(!cfg||!ta) return;
  const q=ta.value.trim(); if(!q){askState[sid]={note:'先写点什么再问。',bad:true};render();return;}
  delete draft['ask-q-'+sid];
  askState[sid]={q,out:'',busy:true,note:'想一下…（可能要等十几秒）'};
  render();
  askCtl=new AbortController();
  try{
    const {text,truncated}=await askApi(ASK_BASE+'\n\n'+cfg.rules+'\n\n她问：\n'+q,{
      signal:askCtl.signal,
      onText:({text})=>{ const st=askState[sid]; if(st){st.out=text;st.note='';}
        const el=document.getElementById('ask-out-'+sid); if(el) el.textContent=text; },
    });
    askState[sid]={q,out:text,busy:false,note:truncated?'太长了，被截断了——分开问试试。':''};
  }catch(e){
    const st=askState[sid]||{};
    if(e&&e.code==='cancelled') askState[sid]={q,out:e.text||st.out||'',busy:false,note:'停了。'};
    else askState[sid]={q,out:(e&&e.text)||'',busy:false,note:(ASK_ERR[e&&e.code]||'出错了，再点一次试试。'),bad:true};
  }
  askCtl=null; render();
}

// enwords：一个词一条（聊天里学的由 Claude 写进来，也可以自己加）。enlearn/main：词表里点过「已学」的词。
let enFilter='all', enQ='';
const enKey=w=>String(w||'').toLowerCase().trim().replace(/[\s-]+/g,'_');
function enLearned(){ // 词 → 怎么学的。单词本里学过的词，会把词表里同一个词也标绿
  const m={}, main=mem.enlearn.main||{};
  for(const k in main) if(main[k]) m[k]={at:main[k],via:'tick'};
  for(const d of Object.values(mem.enwords)){ if(!d||!d.learned) continue;
    for(const k of [d.w,d.awl]) if(k) m[enKey(k)]={at:d.learnedAt||'',via:'book',src:d.src||'单词本'}; }
  return m;
}
function enShow(w,zh,l){
  if(enFilter==='done'&&!l) return false;
  if(enFilter==='todo'&&l) return false;
  if(enQ&&!(String(w).toLowerCase().includes(enQ)||String(zh).includes(enQ))) return false;
  return true;
}
function enChips(words,L){
  return words.filter(([w,zh])=>enShow(w,zh,L[enKey(w)])).map(([w,zh])=>{const k=enKey(w), l=L[k];
    return `<button class="chip ${l?'ok':''}" data-awl="${esc(k)}" title="${l?(l.via==='book'?'在单词本里学过，这里自动标绿':'已学 · 再点一下取消'):'点一下标成已学'}"><span class="w">${esc(w)}</span><span class="z">${esc(zh)}</span>${l&&l.via==='book'?`<span class="v">${esc(l.src)}</span>`:''}</button>`;}).join('');
}

// ── 像 Excel 那样拖着换位置 ──
function hwMove(pairs){ // [[fromKey, toKey, r, c], ...] 先全部读出来再写，免得互相盖掉
  const snap={}; for(const [f] of pairs) snap[f]=mem.hw[f]?JSON.parse(JSON.stringify(mem.hw[f])):null;
  for(const [f,t,r,c] of pairs){
    const v=snap[f];
    if(v) store.set('hw',t,Object.assign({},v,{r,c}));
    else if(mem.hw[t]) store.del('hw',t);
  }
}
function swapCells(r1,c1,r2,c2){
  if(r1===r2&&c1===c2){render();return;}
  const t=JSON.parse(JSON.stringify(ttData()));
  if(!t.rows[r1]||!t.rows[r2]){render();return;}
  const a=t.rows[r1][c1]||'', b=t.rows[r2][c2]||'';
  t.rows[r1][c1]=b; t.rows[r2][c2]=a;
  openHw=null; editing=null;
  ttSave(t);
  hwMove([[hwKey(r1,c1),hwKey(r2,c2),r2,c2],[hwKey(r2,c2),hwKey(r1,c1),r1,c1]]);
}
function insertRow(r){ // 在 r 下面插一行空的，下面的行连作业一起往下挪
  const t=JSON.parse(JSON.stringify(ttData())); const n=(t.days||[]).length;
  t.rows.splice(r+1,0,Array.from({length:n},()=>''));
  openHw=null; editing=null; ttSave(t);
  const pairs=[]; for(let i=t.rows.length-2;i>r;i--) for(let c=0;c<n;c++) pairs.push([hwKey(i,c),hwKey(i+1,c),i+1,c]);
  for(let c=0;c<n;c++) pairs.push([hwKey(r+1,c)+'#none',hwKey(r+1,c),r+1,c]); // 新行的作业位清空
  hwMove(pairs);
}
function deleteRow(r){
  const t=JSON.parse(JSON.stringify(ttData())); const n=(t.days||[]).length;
  if(t.rows.length<=1||!t.rows[r]||!t.rows[r].every(x=>!x)) return;
  t.rows.splice(r,1); openHw=null; editing=null; ttSave(t);
  const pairs=[]; for(let c=0;c<n;c++) pairs.push([hwKey(r,c)+'#none',hwKey(r,c),r,c]);
  for(let i=r+1;i<=t.rows.length;i++) for(let c=0;c<n;c++) pairs.push([hwKey(i,c),hwKey(i-1,c),i-1,c]);
  for(let c=0;c<n;c++) pairs.push([hwKey(t.rows.length,c)+'#none',hwKey(t.rows.length,c),t.rows.length,c]); // 最后一行的旧位置清掉
  hwMove(pairs);
}
function swapRows(r1,r2){
  if(r1===r2){render();return;}
  const t=JSON.parse(JSON.stringify(ttData()));
  if(!t.rows[r1]||!t.rows[r2]){render();return;}
  const a=t.rows[r1]; t.rows[r1]=t.rows[r2]; t.rows[r2]=a;
  openHw=null; editing=null;
  ttSave(t);
  const n=Math.max(t.rows[r1].length,t.rows[r2].length), pairs=[];
  for(let c=0;c<n;c++){ pairs.push([hwKey(r1,c),hwKey(r2,c),r2,c]); pairs.push([hwKey(r2,c),hwKey(r1,c),r1,c]); }
  hwMove(pairs);
}
let drag=null, ghost=null, dragged=false;
function dragClear(){
  document.querySelectorAll('.drop').forEach(x=>x.classList.remove('drop'));
  document.querySelectorAll('.dragging').forEach(x=>x.classList.remove('dragging'));
  if(ghost){ghost.remove();ghost=null;}
}
document.addEventListener('pointerdown',e=>{
  const g=e.target.closest('[data-mv],[data-mvrow]'); if(!g) return;
  e.preventDefault(); e.stopPropagation();
  if(editing) ttCommit();
  if(openHw) hwCommit(true);
  if(g.dataset.mvrow!==undefined){
    const r=Number(g.dataset.mvrow);
    drag={row:true,r,id:e.pointerId,moved:false};
    const tr=g.closest('tr'); if(tr) tr.classList.add('dragging');
  }else{
    const [r,c]=g.dataset.mv.split(':').map(Number);
    drag={row:false,r,c,id:e.pointerId,moved:false};
    const td=g.closest('td'); if(td) td.classList.add('dragging');
  }
  try{g.setPointerCapture(e.pointerId);}catch(err){}
});
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id) return;
  if(!drag.moved){ drag.moved=true;
    ghost=document.createElement('div'); ghost.className='dragghost';
    const t=ttData();
    ghost.textContent = drag.row
      ? ('第 '+(drag.r+1)+' 行 · '+((t.rows[drag.r]||[]).filter(Boolean).length)+' 格有内容')
      : (((t.rows[drag.r]||[])[drag.c]||'').trim()||'（空格子）');
    document.body.appendChild(ghost);
  }
  ghost.style.left=Math.min(e.clientX+14,innerWidth-244)+'px';
  ghost.style.top=Math.min(e.clientY+14,innerHeight-80)+'px';
  document.querySelectorAll('.drop').forEach(x=>x.classList.remove('drop'));
  const el=document.elementFromPoint(e.clientX,e.clientY); if(!el||!el.closest) return;
  if(drag.row){
    const tr=el.closest('tr[data-row]');
    if(tr&&Number(tr.dataset.row)!==drag.r) tr.classList.add('drop');
  }else{
    const td=el.closest('[data-cell]');
    if(td&&td.dataset.cell!==drag.r+':'+drag.c) td.classList.add('drop');
  }
});
function dragEnd(e){
  if(!drag||(e&&e.pointerId!==drag.id)) return;
  const d=drag; drag=null;
  const tgt=document.querySelector('.drop');
  const key=tgt?(d.row?tgt.dataset.row:tgt.dataset.cell):null;
  dragClear();
  if(d.moved){ dragged=true; setTimeout(()=>{dragged=false},80); }
  if(d.moved&&key!=null){
    if(d.row) swapRows(d.r,Number(key));
    else { const [r2,c2]=key.split(':').map(Number); swapCells(d.r,d.c,r2,c2); }
  } else render();
}
document.addEventListener('pointerup',dragEnd);
document.addEventListener('pointercancel',dragEnd);

function ttCommit(){
  const ta=document.getElementById('tt-edit'); if(!ta||!editing){editing=null;return;}
  const t=JSON.parse(JSON.stringify(ttData())); const {r,c}=editing; const v=ta.value.replace(/\s+$/,'');
  editing=null;
  if((t.rows[r][c]||'')===v){render();return;}
  t.rows[r][c]=v; ttSave(t);
}
function copyText(txt,msg){
  const show=m=>{const el=document.getElementById('sb-ok'); if(el){el.textContent=m;setTimeout(()=>{el.textContent=''},4000);}};
  const manual=()=>{const el=document.getElementById('sb-text-'+((mem.shots[STORY.id]||{}).p||0));
    if(el){const r=document.createRange();r.selectNodeContents(el);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);}
    show('自动复制没成功——文字已选中，长按拷贝');};
  try{ navigator.clipboard.writeText(txt).then(()=>show(msg),manual); }catch(e){ manual(); }
}
function hwCommit(close){
  if(!openHw) return false;
  const ta=document.getElementById('hw-text'); if(!ta){ if(close)openHw=null; return false; }
  const [r,c]=openHw.split(':').map(Number);
  const old=mem.hw[hwKey(r,c)]||{};
  const text=(ta.value||'').trim();
  const due=(document.getElementById('hw-due')||{}).value||'';
  const done=!!(document.getElementById('hw-done')||{}).checked;
  if(close) openHw=null;
  if(text===(old.text||'')&&due===(old.due||'')&&done===!!old.done) return false;
  if(!text&&!due){ if(old.text||old.due) store.del('hw',hwKey(r,c)); return true; }
  store.set('hw',hwKey(r,c),{text,due,done,r,c,updatedAt:now()});
  return true;
}

    copyText(STORY.shots[i].prompt,'提示词已复制，去即梦粘贴'); return;}
  const vc=e.target.closest('[data-vocopy]'); if(vc){const i=Number(vc.dataset.vocopy);
    copyText(STORY.shots[i].vo,'旁白已复制'); return;}
  const pr=e.target.closest('[data-per]'); if(pr){const i=Math.min(Math.max(Number(pr.dataset.per),0),PERIODS.length-1);
    store.set('hist','main',Object.assign({},mem.hist.main||{},{p:i})); return;}
  const pd=e.target.closest('[data-perdone]'); if(pd){e.stopPropagation();const i=pd.dataset.perdone;
    const st=mem.hist.main||{}; const d=Object.assign({},st.done||{});
    if(pd.checked) d[i]=true; else delete d[i];
    store.set('hist','main',Object.assign({},st,{done:d})); return;}
  const ch=e.target.closest('[data-ch]'); if(ch){const [id,k]=ch.dataset.ch.split(':');const bk=TEXTS[id];
    const i=Math.min(Math.max(Number(k),0),bk.chapters.length-1);
    store.set('classics',id,{ch:i,where:bk.chapters[i].t}); return;}
  const ask=e.target.closest('[data-ask]'); if(ask){doAsk(ask.dataset.ask);return;}
  if(e.target.closest('[data-askstop]')){ if(askCtl) askCtl.abort(); return; }
  const asv=e.target.closest('[data-asksave]'); if(asv){const sid=asv.dataset.asksave,st=askState[sid]||{};
    if(st.q&&st.out){ store.set('notes',uid(),{subject:sid,text:'问：'+st.q+'\n\n'+st.out,createdAt:now()}); askState[sid]={note:'存进笔记了。'}; render(); } return;}
  const acl=e.target.closest('[data-askclear]'); if(acl){askState[acl.dataset.askclear]={};render();return;}
  const awc=e.target.closest('[data-awl]'); if(awc){enToggle(awc.dataset.awl);return;}
  const enl=e.target.closest('[data-enlearn]'); if(enl){const id=enl.dataset.enlearn,d=mem.enwords[id]||{};
    store.set('enwords',id,d.learned?{learned:false,learnedAt:''}:{learned:true,learnedAt:now()});return;}
  const enf=e.target.closest('[data-enf]'); if(enf){enFilter=enf.dataset.enf;render();return;}
  const go=e.target.closest('[data-go]'); if(go){if(openWk)wknCommit(openWk);cur=go.dataset.go;openOp=null;openWk=null;window.scrollTo(0,0);render();return;}
  const del=e.target.closest('[data-del]'); if(del){const [col,id]=del.dataset.del.split(':');
    if(del.classList.contains('arm')){ store.del(col,id); return; }
    document.querySelectorAll('.x.arm').forEach(b=>{b.classList.remove('arm');b.textContent='×';});
    del.classList.add('arm'); del.textContent='确认删除'; setTimeout(()=>{ if(del.isConnected){del.classList.remove('arm');del.textContent='×';} },3000); return;}
  const cyc=e.target.closest('[data-cycle]'); if(cyc){const id=cyc.dataset.cycle,c=mem.courses[id];const nx={want:'doing',doing:'done',done:'want'};store.set('courses',id,{status:nx[c.status||'want']});return;}
  const chk=e.target.closest('[data-check]'); if(chk){e.stopPropagation();store.set(chk.dataset.col||'operas',chk.dataset.check,{done:chk.checked});return;}
  const sv=e.target.closest('[data-opsave]'); if(sv){const id=sv.dataset.opsave,col=sv.dataset.col||'operas',d={};document.querySelectorAll(`[data-opf^="${id}:"]`).forEach(el=>{d[el.dataset.opf.split(':')[1]]=el.value;});
    Object.keys(draft).forEach(k=>{if(k.startsWith('opf-')&&k.endsWith('-'+id))delete draft[k]});
    await store.set(col,id,d); const s=document.getElementById('ops-'+id); if(s){s.textContent='已保存';setTimeout(()=>{s.textContent=''},1500)} return;}
  const tg=e.target.closest('[data-toggle]'); if(tg&&!e.target.closest('input,label')){const id=tg.dataset.toggle;openOp=openOp===id?null:id;render();return;}
  const lb=e.target.closest('label.nm'); if(lb){e.preventDefault();const id=lb.closest('.op').dataset.op;openOp=openOp===id?null:id;render();return;}
});
// 课表格子：失焦（Tab、切 app、点了页面外）也保存
document.addEventListener('focusout',e=>{
  if(e.target.id!=='tt-edit'||!editing) return;
  const {r,c}=editing;
  setTimeout(()=>{ if(editing&&editing.r===r&&editing.c===c&&document.activeElement!==document.getElementById('tt-edit')) ttCommit(); },120);
});
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&editing) ttCommit(); });
document.addEventListener('keydown',e=>{
  if(e.target.id==='tt-edit'){ if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();ttCommit();} if(e.key==='Escape'){editing=null;render();} return; }
  if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.cell){e.preventDefault();e.target.click();}
});
document.addEventListener('change',e=>{
  if(e.target.id==='bk-file'){ const f=e.target.files&&e.target.files[0]; if(!f) return;
    bkMsg('读文件…'); const fr=new FileReader();
    fr.onload=()=>doImport(String(fr.result||''));
    fr.onerror=()=>bkMsg('文件读不出来。',true);
    fr.readAsText(f); e.target.value=''; return; }
  const ct=e.target.closest('[data-cstarget]'); if(ct){const wk=isoWeek(new Date()),c0=mem.hist.csweek||{};
    store.set('hist','csweek',{iso:wk,mins:(c0.iso===wk?Number(c0.mins):0)||0,target:Number(ct.value)});return;}
  const ss=e.target.closest('[data-shotsel]'); if(ss){store.set('shots',STORY.id,Object.assign({},mem.shots[STORY.id]||{},{p:Number(ss.value)}));return;}
  const ps=e.target.closest('[data-persel]'); if(ps){store.set('hist','main',Object.assign({},mem.hist.main||{},{p:Number(ps.value)}));return;}
  const sel=e.target.closest('[data-chsel]'); if(!sel)return;
  const id=sel.dataset.chsel,bk=TEXTS[id],i=Number(sel.value);
  store.set('classics',id,{ch:i,where:bk.chapters[i].t});
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]'); if(!f)return; e.preventDefault();
  const fd=Object.fromEntries(new FormData(f).entries()); const kind=f.dataset.form; const id=uid();
  f.querySelectorAll('[id]').forEach(el=>delete draft[el.id]);
  if(kind==='course') store.set('courses',id,{subject:cur,title:fd.title.trim(),url:fd.url.trim(),note:fd.note.trim(),status:fd.status,area:(fd.area||'').trim(),createdAt:now()});
  if(kind==='note') store.set('notes',id,{subject:cur,text:fd.text.trim(),createdAt:now()});
  if(kind==='enword') store.set('enwords',id,{w:fd.w.trim(),zh:fd.zh.trim(),note:(fd.note||'').trim(),src:'自己加的',learned:false,createdAt:now()});
  if(kind==='word') store.set('words',id,{zh:fd.zh.trim(),ru:fd.ru.trim(),ex:(fd.ex||'').trim(),createdAt:now()});
  f.reset();
});
render(); connect();
</script>
